<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>一步</title>
<style>
  :root { --ink:#22303c; --paper:#ffffff; --danger:#FF5A1F; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    margin:0; height:100%; background:#8fd3f4; overflow:hidden;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none;
  }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color:var(--ink); }
  canvas {
    display:block; position:fixed; inset:0; width:100%; height:100%;
    image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action:none;
  }
  #hud {
    position:fixed; top:calc(env(safe-area-inset-top) + 10px); left:0; right:0;
    text-align:center; pointer-events:none; font-variant-numeric:tabular-nums;
    font-size:clamp(30px, 10vw, 44px); font-weight:800; letter-spacing:.06em;
    color:#ffffff; -webkit-text-stroke:3px var(--ink); paint-order:stroke fill;
    text-shadow:0 3px 0 rgba(20,32,44,.22); line-height:1;
  }
  #overlay {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; pointer-events:none; transition:opacity .3s ease;
    background:rgba(24,38,50,.28);
  }
  #overlay.hide { opacity:0; }
  .panel {
    display:flex; flex-direction:column; align-items:center; gap:10px;
    background:#fff; border:4px solid var(--ink); border-radius:16px;
    padding:22px 28px 20px; box-shadow:0 10px 0 rgba(24,38,50,.35);
    min-width:min(70vw, 250px);
    animation:pop .3s cubic-bezier(.2,1.4,.5,1) both;
  }
  @keyframes pop { from { transform:translateY(8px) scale(.95); opacity:0 } to { transform:none; opacity:1 } }
  .big { font-size:min(16vw, 68px); font-weight:800; letter-spacing:.04em; line-height:1; color:var(--ink); font-variant-numeric:tabular-nums; }
  .sub { font-size:12px; letter-spacing:.12em; color:#5b6b78; }
  .hint {
    margin-top:4px; font-size:11px; letter-spacing:.24em; color:var(--ink);
    border:2px dashed rgba(34,48,60,.3); border-radius:999px; padding:6px 14px;
    animation:breathe 2s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity:.35 } 50% { opacity:.9 } }
  #btns {
    position:fixed; top:calc(env(safe-area-inset-top) + 8px); right:8px;
    display:flex; gap:6px;
  }
  #btns button {
    width:38px; height:38px; padding:0; cursor:pointer;
    border:3px solid var(--ink); border-radius:10px; background:#fff;
    color:var(--ink); font:800 13px/1 ui-monospace, Menlo, monospace;
    box-shadow:0 3px 0 rgba(24,38,50,.3);
  }
  #btns button:active { transform:translateY(2px); box-shadow:none; }
  #btns button.muted { opacity:.42; }
  #mult {
    position:fixed; top:calc(env(safe-area-inset-top) + 62px); left:50%;
    transform:translateX(-50%); display:flex; gap:5px; pointer-events:none;
    opacity:0; transition:opacity .18s ease;
  }
  #mult.on { opacity:1; }
  #mult i {
    width:15px; height:6px; border:2px solid var(--ink); border-radius:2px;
    background:rgba(255,255,255,.35);
  }
  #mult i.f { background:var(--danger); }
  #tip {
    position:fixed; left:50%; bottom:24%; transform:translateX(-50%);
    max-width:76vw; padding:7px 14px; border:3px solid var(--ink); border-radius:12px;
    background:#fff; color:var(--ink); font-size:11px; letter-spacing:.08em;
    line-height:1.6; text-align:center; pointer-events:none;
    opacity:0; transition:opacity .25s ease;
  }
  #tip.on { opacity:1; }
  #flash {
    position:fixed; left:50%; top:34%; transform:translateX(-50%);
    font-weight:800; font-size:19px; letter-spacing:.08em; white-space:nowrap;
    color:#fff; -webkit-text-stroke:4px var(--ink); paint-order:stroke fill;
    pointer-events:none; opacity:0;
  }
  #flash.pop { animation:flashPop .62s ease-out both; }
  @keyframes flashPop {
    0% { opacity:0; transform:translate(-50%,8px) scale(.85); }
    22% { opacity:1; transform:translate(-50%,0) scale(1.04); }
    70% { opacity:1; transform:translate(-50%,-4px) scale(1); }
    100% { opacity:0; transform:translate(-50%,-12px) scale(1); }
  }
  .cause { color:var(--danger); letter-spacing:.06em; }
  @media (prefers-reduced-motion: reduce) {
    .hint { animation:none; } .panel { animation:none; } #flash.pop { animation:none; opacity:1; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">0</div>
<div id="mult"><i></i><i></i><i></i><i></i></div>
<div id="tip"></div>
<div id="flash"></div>
<div id="overlay">
  <div class="panel">
    <div class="big">一步</div>
    <div class="sub">按住向前滑 · 松开一侧抬脚越障</div>
    <div class="hint">按住开始</div>
  </div>
</div>
<div id="btns">
  <button id="btnPause" type="button" aria-label="暂停">II</button>
  <button id="btnMute" type="button" aria-label="声音">音</button>
</div>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const hud = document.getElementById('hud');
  const overlay = document.getElementById('overlay');
  const multEl = document.getElementById('mult');
  const tipEl = document.getElementById('tip');
  const flashEl = document.getElementById('flash');
  const btnPause = document.getElementById('btnPause');
  const btnMute = document.getElementById('btnMute');

  const PAPER = '#ffffff';
  const DANGER = '#FF5A1F';

  /* ---------------- 世界参数 ---------------- */
  const Z_FAR = 150;
  const Z_NEAR = 8;
  const HIT_Z = 10;
  const BOTH_UP_GRACE = 0.16;
  const FALL_TIME = 0.82;
  const BEAT = 0.5;          // 120 BPM

  let VW = 180, VH = 320, DPR = 1;
  let horizon = 0, FOCAL = 0, S_HIT = 1;
  let LANE = 2.2, ROAD_HALF = 8, CAM_H = 9.2;
  let skateL = 0, skateR = 0, skateY = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function approach(v, target, k) { return v + (target - v) * clamp(k, 0, 1); }

  /* ---------------- 配色段落 ---------------- */
  const PALETTES = [
    { sky1:'#57c6ec', sky2:'#a9e8f7', sun:'#fff4ad', cloud:'#ffffff', cloud2:'#d6f2fb', hill:'#46cf6c', hill2:'#2ba653', road:'#f3dda6', road2:'#e9cf90', seam:'#dcbd7c', edge:'#8a6538', prop:'#3ec95f', prop2:'#249b45', ground:'#66d167', ground2:'#54c25a', ink:'#1b2736' },
    { sky1:'#ff9a5e', sky2:'#ffd9a6', sun:'#fff0b8', cloud:'#fff0dd', cloud2:'#f3c9a6', hill:'#c17b4a', hill2:'#9d5f37', road:'#f2d4a2', road2:'#e8c48e', seam:'#d8b079', edge:'#7d5330', prop:'#b8763f', prop2:'#95592c', ground:'#b98a4e', ground2:'#a5783f', ink:'#33231a' },
    { sky1:'#0d1730', sky2:'#223659', sun:'#fff6c8', cloud:'#2b3f6b', cloud2:'#213252', hill:'#1d2f52', hill2:'#16243f', road:'#33436a', road2:'#2c3a5c', seam:'#22304d', edge:'#7f9ac9', prop:'#25406a', prop2:'#1a3054', ground:'#1b2c4c', ground2:'#152440', ink:'#060b16' },
    { sky1:'#8fa3ae', sky2:'#d2e0e6', sun:'#f4f7f2', cloud:'#ffffff', cloud2:'#cddbe1', hill:'#6f9a7f', hill2:'#567f68', road:'#cfd9d2', road2:'#c1ccc4', seam:'#acb8b1', edge:'#54685e', prop:'#6f9a7f', prop2:'#567f68', ground:'#74a07f', ground2:'#638e70', ink:'#182420' }
  ];
  const TUNNEL_PAL = { sky1:'#0b0f17', sky2:'#161c26', sun:'#ffcf7a', cloud:'#232b38', cloud2:'#1a212c', hill:'#161b24', hill2:'#11161e', road:'#242832', road2:'#1e222b', seam:'#181c24', edge:'#5d6a80', prop:'#1b222c', prop2:'#131922', ground:'#181c24', ground2:'#12161d', ink:'#04070c' };
  const PAL_KEYS = ['sky1','sky2','sun','cloud','cloud2','hill','hill2','road','road2','seam','edge','prop','prop2','ground','ground2','ink'];
  let pal = PALETTES[0];

  function hx(c) {
    if (c.charAt(0) === '#') {
      return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
    }
    const m = c.match(/\d+/g);
    return [+m[0], +m[1], +m[2]];
  }
  function mixPal(a, b, t) {
    const o = {};
    for (const k of PAL_KEYS) {
      const A = hx(a[k]), B = hx(b[k]);
      o[k] = 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * t) + ',' +
                    Math.round(A[1] + (B[1] - A[1]) * t) + ',' +
                    Math.round(A[2] + (B[2] - A[2]) * t) + ')';
    }
    return o;
  }
  function mixHex(a, b, t) {
    const A = hx(a), B = hx(b);
    return 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * t) + ',' +
                  Math.round(A[1] + (B[1] - A[1]) * t) + ',' +
                  Math.round(A[2] + (B[2] - A[2]) * t) + ')';
  }

  /* ---------------- 状态 ---------------- */
  const RESUME_PLANT = 1.2;  // 恢复后双脚落地的保护时长
  const feet = [
    { sources: new Set(), down: false, prevDown: true, plant: 0, bob: 0 },
    { sources: new Set(), down: false, prevDown: true, plant: 0, bob: 0 }
  ];

  let state = 'ready'; // ready | playing | falling | over
  let dist = 0;
  let speed = 0;
  let bothUpT = 0;
  let obstacles = [];
  let props = [];
  let particles = [];
  let score = 0;
  let scoreAcc = 0;
  let best = 0;
  let fallT = 0;
  let overAt = 0;
  let bobPhase = 0;
  let bobY = 0;
  let fallCause = '';

  // 失衡
  let balance = 0;

  // 连击
  let combo = 0;

  // 弯道
  let curve = null;
  let curveAmt = 0;
  let nextCurveAt = 170;

  // 节奏
  let beatAcc = 0;
  let beatPulse = 0;
  let beatCountdown = 2.5;

  // 暂停 / 静音 / 冻结帧
  let paused = false;
  let resumeGrace = 0;
  let freezeT = 0;
  let muted = false;
  let taught = false;

  try {
    best = parseInt(localStorage.getItem('yibu.best.score') || '0', 10) || 0;
    muted = localStorage.getItem('yibu.muted') === '1';
    taught = localStorage.getItem('yibu.taught') === '1';
  } catch (e) {}

  /* ---------------- 音频 ---------------- */
  let ac = null, master = null;

  function audio() {
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    if (ac.state === 'suspended') ac.resume();
    master = ac.createGain();
    master.gain.value = muted ? 0 : 0.16;
    master.connect(ac.destination);
  }

  function setMuted(m) {
    muted = !!m;
    if (master) master.gain.value = muted ? 0 : 0.16;
    btnMute.classList.toggle('muted', muted);
    btnMute.textContent = muted ? '静' : '音';
    try { localStorage.setItem('yibu.muted', muted ? '1' : '0'); } catch (e) {}
  }

  function blip(freq, dur, type, vol, slideTo, delay) {
    if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }

  function sfxStep(side) { blip(side === 0 ? 220 : 165, 0.06, 'square', 0.35); }
  function sfxPass() { blip(520, 0.035, 'square', 0.14); }
  function sfxTick() { blip(90, 0.02, 'square', 0.05); }
  function sfxFall() {
    blip(190, 0.28, 'sawtooth', 0.32, 60);
    blip(90, 0.4, 'square', 0.3, 40, 0.05);
  }

  /* ---------------- 背景音乐（程序化 chiptune） ---------------- */
  const MUSIC_PROG = [
    { root: 48, notes: [60, 64, 67, 72] }, // C
    { root: 45, notes: [57, 60, 64, 69] }, // Am
    { root: 41, notes: [53, 57, 60, 65] }, // F
    { root: 43, notes: [55, 59, 62, 67] }  // G
  ];
  const MUSIC_STEP = BEAT / 4; // 16 分音符
  let music = null;

  function mtof(n) { return 440 * Math.pow(2, (n - 69) / 12); }

  function musicVoice(note, t, dur, type, vol) {
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.value = mtof(note);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(music.lp);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  function musicStep(step, t) {
    const bar = Math.floor(step / 16) % 8;
    const s = step % 16;
    const ch = MUSIC_PROG[bar % 4];
    const B = bar >= 4; // 后半段加花，8 小节一循环

    // 低音：每拍根音，反拍五度（B 段改走高八度，托住情绪）
    if (s % 4 === 0) musicVoice(ch.root, t, 0.22, 'triangle', 0.32);
    else if (s % 4 === 2) musicVoice(B ? ch.root + 7 : ch.root + 12, t, 0.1, 'triangle', 0.15);

    // 琶音：八分音符，B 段整体上移一位并叠高八度
    if (s % 2 === 0) {
      const n = ch.notes[(Math.floor(s / 2) + (B ? 2 : 0)) % 4];
      musicVoice(n, t, 0.1, 'square', 0.1);
      if (B || dist > 260) musicVoice(n + 12, t, 0.07, 'square', 0.05);
    } else if (B) {
      // 反拍打点只出现在 B 段
      musicVoice(7200, t, 0.02, 'square', 0.06);
    }

    // 第 8 小节收尾过门
    if (bar === 7 && s >= 12) {
      musicVoice(ch.notes[(s - 12) % 4] + 12, t, 0.08, 'square', 0.09);
    }
  }

  function musicTick() {
    if (!music || !ac) return;
    const ahead = ac.currentTime + 0.2;
    while (music.next < ahead) {
      musicStep(music.step, music.next);
      music.step = (music.step + 1) % 128;
      music.next += MUSIC_STEP;
    }
    // 隧道里闷一点，速度越快越亮
    const cut = 2600 - tunnelMix() * 1700 + Math.min(900, Math.max(0, speed - 26) * 45);
    music.lp.frequency.setTargetAtTime(Math.max(650, cut), ac.currentTime, 0.3);
  }

  function musicStart() {
    if (!ac || music) return;
    const bus = ac.createGain();
    const lp = ac.createBiquadFilter();
    bus.gain.setValueAtTime(0.0001, ac.currentTime);
    bus.gain.exponentialRampToValueAtTime(0.6, ac.currentTime + 0.35);
    bus.connect(master);
    lp.type = 'lowpass';
    lp.frequency.value = 2600;
    lp.Q.value = 0.4;
    lp.connect(bus);
    music = {
      bus: bus,
      lp: lp,
      step: 0,
      next: ac.currentTime + 0.08,
      timer: setInterval(musicTick, 60)
    };
  }

  function musicStop() {
    if (!music) return;
    const m = music;
    music = null;
    clearInterval(m.timer);
    try {
      m.bus.gain.cancelScheduledValues(ac.currentTime);
      m.bus.gain.setValueAtTime(Math.max(0.0001, m.bus.gain.value), ac.currentTime);
      m.bus.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.18);
    } catch (e) {}
    setTimeout(() => {
      try { m.bus.disconnect(); } catch (e) {}
    }, 280);
  }

  /* ---------------- 布局 ---------------- */
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    if (h >= w) {
      VW = 180;
      VH = Math.max(240, Math.min(430, Math.round(VW * h / w)));
    } else {
      VH = 180;
      VW = Math.max(260, Math.min(430, Math.round(VH * w / h)));
    }
    canvas.width = VW;
    canvas.height = VH;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.imageSmoothingEnabled = false;

    horizon = Math.round(VH * 0.46);
    FOCAL = VH * 0.5;
    S_HIT = FOCAL / HIT_Z;
    LANE = (0.175 * VW) / S_HIT;
    ROAD_HALF = (0.72 * VW) / S_HIT;
    CAM_H = (VH * 0.92 - horizon) / S_HIT;

    skateL = Math.round(VW * 0.385);
    skateR = Math.round(VW * 0.615);
    skateY = Math.round(horizon + CAM_H * S_HIT) - 2;
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  /* ---------------- 投影 ---------------- */
  function project(xw, z) {
    const s = FOCAL / Math.max(1, z);
    const sway = Math.sin((dist + z) * 0.02) * (z / Z_FAR) * 3.2;
    const dir = curve ? (curve.side === 0 ? -1 : 1) : 0;
    const bend = curveAmt * dir * (z / Z_FAR) * (z / Z_FAR) * VW * 0.13;
    return {
      x: VW / 2 + (xw + sway) * s + bend,
      y: horizon + CAM_H * s + bobY,
      s: s
    };
  }

  /* ---------------- 分数 / 连击 ---------------- */
  function mult() { return Math.min(4, 1 + Math.floor(combo / 10)); }
  function setScore(n) {
    score = n;
    hud.textContent = String(score);
  }

  /* ---------------- 游戏流程 ---------------- */
  function resetProps() {
    props = [];
    for (let i = 0; i < 12; i++) props.push(newProp(Z_NEAR + (i + 0.5) * (Z_FAR / 12)));
  }

  function newProp(z) {
    return {
      z: z,
      x: (Math.random() < 0.5 ? -1 : 1) * (ROAD_HALF + 2.5 + Math.random() * 7),
      h: 6 + Math.random() * 10
    };
  }

  function reset() {
    dist = 0;
    speed = 0;
    bothUpT = -1;
    obstacles = [];
    particles = [];
    fallCause = '';
    balance = 0;
    combo = 0;
    curve = null;
    curveAmt = 0;
    nextCurveAt = 170;
    beatAcc = 0;
    beatPulse = 0;
    beatCountdown = 2.5;
    fallT = 0;
    bobPhase = 0;
    bobY = 0;
    feet.forEach((f) => { f.sources.clear(); f.bob = 0; f.down = false; f.prevDown = true; f.plant = 0; });
    paused = false;
    resumeGrace = 0;
    freezeT = 0;
    resetProps();
    scoreAcc = 0;
    setScore(0);
    syncMult();
    // 开局给一组目标，避免前几秒空跑
    addObstacle(randLane(), 95);
  }

  function toPlaying() {
    reset();
    state = 'playing';
    overlay.classList.add('hide');
    musicStart();
    if (!taught) {
      taught = true;
      try { localStorage.setItem('yibu.taught', '1'); } catch (e) {}
      showTip('按住左右半屏向前滑，松开哪边就抬哪只脚', 3600);
    }
  }

  function start() {
    audio();
    toPlaying();
  }

  function showReady() {
    state = 'ready';
    overlay.classList.remove('hide');
    overlay.innerHTML =
      '<div class="panel">' +
      '<div class="big">一步</div>' +
      '<div class="sub">按住向前滑 · 松开一侧抬脚越障</div>' +
      '<div class="sub">双脚离地或单脚太久会摔</div>' +
      (best > 0 ? '<div class="sub">最佳 ' + best + '</div>' : '') +
      '<div class="hint">按住开始</div>' +
      '</div>';
  }

  let tipTimer = 0;
  function showTip(text, ms) {
    tipEl.textContent = text;
    tipEl.classList.add('on');
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => tipEl.classList.remove('on'), ms);
  }

  function flashText(text) {
    flashEl.textContent = text;
    flashEl.classList.remove('pop');
    void flashEl.offsetWidth;
    flashEl.classList.add('pop');
  }

  function syncMult() {
    const m = state === 'playing' ? mult() : 1;
    multEl.classList.toggle('on', m > 1);
    const bars = multEl.children;
    for (let i = 0; i < bars.length; i++) bars[i].classList.toggle('f', i < m);
  }

  // 摔倒：所有失败共用这一段动画
  function fall(cause) {
    if (state !== 'playing') return;
    state = 'falling';
    fallCause = cause || '';
    fallT = 0;
    bothUpT = 0;
    freezeT = 0.07;
    syncMult();
    musicStop();
    sfxFall();
    for (let i = 0; i < 14; i++) {
      particles.push({
        x: VW / 2 + (Math.random() - 0.5) * 40,
        y: VH - 8,
        vx: (Math.random() - 0.5) * 120,
        vy: -30 - Math.random() * 90,
        life: 0.5 + Math.random() * 0.35,
        t: 0
      });
    }
  }

  const CAUSE_TEXT = {
    hit: '撞到了障碍',
    balance: '单脚太久，失去平衡',
    bothup: '双脚离地，直接摔了'
  };

  function finishOver() {
    state = 'over';
    overAt = performance.now();
    syncMult();
    const isNewBest = score > best;
    if (isNewBest) {
      best = score;
      try { localStorage.setItem('yibu.best.score', String(best)); } catch (e) {}
    }
    overlay.classList.remove('hide');
    overlay.innerHTML =
      '<div class="panel">' +
      '<div class="big">' + score + '</div>' +
      '<div class="sub cause">' + (CAUSE_TEXT[fallCause] || '摔倒了') + '</div>' +
      '<div class="sub">' + (isNewBest ? '新纪录' : '最佳 ' + best) + '</div>' +
      '<div class="hint">按住重来</div>' +
      '</div>';
  }

  function setPaused(v) {
    if (state !== 'playing' || paused === v) return;
    paused = v;
    pointerSide.forEach((side, id) => release(side, 'p' + id));
    pointerSide.clear();
    keysDown.forEach((side, id) => release(side, id));
    keysDown.clear();
    if (v) {
      tipEl.classList.remove('on');
      musicStop();
      overlay.classList.remove('hide');
      overlay.innerHTML =
        '<div class="panel">' +
        '<div class="big">暂停</div>' +
        '<div class="sub">点屏幕继续</div>' +
        '</div>';
    } else {
      overlay.classList.add('hide');
      resumeGrace = 0.6;
      feet[0].plant = RESUME_PLANT;
      feet[1].plant = RESUME_PLANT;
      if (ac && ac.state === 'suspended') ac.resume();
      musicStart();
    }
  }

  function doStep(side) {
    if (state !== 'playing') return;
    feet[side].bob = 1;
    sfxStep(side);
  }

  /* ---------------- 生成 ---------------- */
  const OBS_TYPES = [
    { type: 'rock', wf: 1.25, hf: 0.9 },
    { type: 'cone', wf: 0.7, hf: 1.3 },
    { type: 'barrier', wf: 1.8, hf: 0.55 }
  ];

  function randLane() { return Math.random() < 0.5 ? 0 : 1; }

  function addObstacle(lane, z) {
    const t = OBS_TYPES[Math.floor(Math.random() * OBS_TYPES.length)];
    obstacles.push({ lane: lane, z: z, type: t.type, wf: t.wf, hf: t.hf });
  }

  // 弯道内侧路缘：必须抬脚
  function addCurb(lane, z) {
    obstacles.push({ lane: lane, z: z, type: 'curb', wf: 1.9, hf: 0.46 });
  }

  function startCurve() {
    curve = { side: randLane(), t: 0, dur: 6 };
    const l = curve.side;
    // 间隔拉开，保证两次抬脚之间有足够时间双脚回落失衡
    addCurb(l, Z_FAR);
    addCurb(l, Z_FAR + 65);
    addCurb(l, Z_FAR + 130);
  }

  function spawnBeat() {
    const z = Z_FAR;
    const gap = Math.max(20, speed * BEAT * 1.1);
    const r = Math.random();

    if (dist < 60) {
      addObstacle(randLane(), z);
      return;
    }

    if (r < 0.46) {
      addObstacle(randLane(), z);
    } else if (r < 0.72) {
      const a = randLane();
      addObstacle(a, z);
      addObstacle(1 - a, z + gap * 0.85);
    } else if (r < 0.88) {
      const a = randLane();
      addObstacle(a, z);
      addObstacle(a, z + gap * 0.5);
    } else {
      addObstacle(randLane(), z + gap * 0.35);
    }
  }

  /* ---------------- 输入 ---------------- */
  const pointerSide = new Map();

  function press(side, id) {
    const f = feet[side];
    const wasDown = f.sources.size > 0;
    f.sources.add(id);
    if (!wasDown) doStep(side);
  }

  function release(side, id) {
    feet[side].sources.delete(id);
  }

  function sideAt(x) {
    return x < window.innerWidth / 2 ? 0 : 1;
  }

  function onDown(e) {
    e.preventDefault();
    audio();

    if (paused) setPaused(false);
    if (state === 'ready') {
      start();
    } else if (state === 'over') {
      if (performance.now() - overAt > 420) toPlaying();
      else return;
    } else if (state === 'falling') {
      return;
    }
    if (state !== 'playing') return;

    const side = sideAt(e.clientX);
    pointerSide.set(e.pointerId, side);
    press(side, 'p' + e.pointerId);
  }

  function onUp(e) {
    const side = pointerSide.get(e.pointerId);
    if (side === undefined) return;
    pointerSide.delete(e.pointerId);
    release(side, 'p' + e.pointerId);
  }

  canvas.addEventListener('pointerdown', onDown, { passive: false });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  window.addEventListener('blur', () => {
    pointerSide.forEach((side, id) => release(side, 'p' + id));
    pointerSide.clear();
    if (state === 'playing' && !paused) setPaused(true);
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing' && !paused) setPaused(true);
  });

  btnPause.addEventListener('click', (e) => {
    e.preventDefault();
    if (paused) setPaused(false);
    else if (state === 'playing') setPaused(true);
  });
  btnMute.addEventListener('click', (e) => {
    e.preventDefault();
    audio();
    setMuted(!muted);
  });

  const KEY_SIDE = { KeyA: 0, ArrowLeft: 0, KeyL: 1, ArrowRight: 1 };
  const keysDown = new Map();

  window.addEventListener('keydown', (e) => {
    const side = KEY_SIDE[e.code];
    if (side === undefined || e.repeat) return;
    e.preventDefault();
    audio();

    if (paused) setPaused(false);
    if (state === 'ready') {
      start();
    } else if (state === 'over') {
      if (performance.now() - overAt > 420) toPlaying();
      else return;
    } else if (state === 'falling') {
      return;
    }
    if (state !== 'playing') return;

    const id = 'k' + e.code;
    if (!keysDown.has(id)) {
      keysDown.set(id, side);
      press(side, id);
    }
  });

  window.addEventListener('keyup', (e) => {
    const side = KEY_SIDE[e.code];
    if (side === undefined) return;
    const id = 'k' + e.code;
    if (keysDown.has(id)) {
      keysDown.delete(id);
      release(side, id);
    }
  });

  window.addEventListener('contextmenu', (e) => e.preventDefault());

  /* ---------------- 环境 ---------------- */
  function isTunnel() {
    const seg = Math.floor(dist / 100);
    return seg > 0 && seg % 7 === 5;
  }

  // 隧道进出的柔和过渡
  function tunnelMix() {
    const seg = Math.floor(dist / 100);
    if (seg <= 0 || seg % 7 !== 5) return 0;
    const local = dist - seg * 100;
    const raw = clamp(Math.min(local, 100 - local) / 24, 0, 1);
    return raw * raw * (3 - 2 * raw);
  }

  // 雨天强度：段落两端淡入淡出，避免突然出现/消失
  function rainAmt() {
    const seg = Math.floor(dist / 100);
    if ((((seg % 4) + 4) % 4) !== 3) return 0;
    const local = dist - seg * 100;
    const raw = clamp(Math.min(local, 100 - local) / 18, 0, 1);
    return raw * raw * (3 - 2 * raw);
  }

  function updatePalette() {
    const phase = dist / 100;
    const idx = ((Math.floor(phase) % 4) + 4) % 4;
    const frac = phase - Math.floor(phase);
    let base = PALETTES[idx];
    // 长过渡：整段最后 45% 缓慢变色，避免突然闪一下
    if (frac > 0.55) {
      const t = (frac - 0.55) / 0.45;
      base = mixPal(PALETTES[idx], PALETTES[(idx + 1) % 4], t * t * (3 - 2 * t));
    }
    const tm = tunnelMix();
    if (tm > 0) base = mixPal(base, TUNNEL_PAL, tm);
    pal = base;
  }

  /* ---------------- 世界更新 ---------------- */
  function updateWorld(dt) {
    // 障碍
    for (const o of obstacles) {
      o.z -= speed * dt;
      if (!o.done && o.z <= HIT_Z) {
        o.done = true;
        if (resumeGrace > 0) continue;
        if (feet[o.lane].down) {
          fall('hit');
          break;
        }
        const prevMult = mult();
        combo++;
        sfxPass();
        const hit = project(0, HIT_Z);
        for (let k = 0; k < 5; k++) {
          particles.push({
            x: hit.x + (Math.random() - 0.5) * 14,
            y: hit.y - 2,
            vx: (Math.random() - 0.5) * 90,
            vy: -30 - Math.random() * 70,
            life: 0.32 + Math.random() * 0.2,
            t: 0,
            c: PIG.gold
          });
        }
        if (mult() > prevMult) {
          flashText('倍率 ×' + mult());
          syncMult();
        }
      }
    }
    obstacles = obstacles.filter((o) => o.z > Z_NEAR - 3);
    if (state !== 'playing') return;

    // 弯道
    if (!curve && dist >= nextCurveAt) startCurve();
    if (curve) {
      if (!curve.done) {
        curve.t += dt;
        if (curve.t >= curve.dur) curve.done = true;
      }
      curveAmt = approach(curveAmt, curve.done ? 0 : 1, dt * 2.4);
      if (curve.done && curveAmt < 0.02) {
        curve = null;
        curveAmt = 0;
        nextCurveAt = dist + 180 + Math.random() * 80;
      }
    }

    // 节拍：地鼓脉冲 + 量化生成
    beatAcc += dt;
    while (beatAcc >= BEAT) {
      beatAcc -= BEAT;
      beatPulse = 1;
      sfxTick();
      beatCountdown -= 1;
      if (beatCountdown <= 0) {
        if (!curve && state === 'playing') spawnBeat();
        beatCountdown += Math.max(1.5, 3 - dist * 0.002);
      }
    }
    beatPulse = Math.max(0, beatPulse - dt * 3.4);
  }

  /* ---------------- 更新 ---------------- */
  function spawnLandingDust(i) {
    const u = pigU();
    const x = VW / 2 + (i === 0 ? -1 : 1) * 23 * u;
    const c = mixHex(pal.road, '#ffffff', 0.55);
    for (let k = 0; k < 4; k++) {
      particles.push({
        x: x + (Math.random() - 0.5) * 10,
        y: skateY - 1,
        vx: (Math.random() - 0.5) * 46,
        vy: -14 - Math.random() * 30,
        life: 0.28 + Math.random() * 0.18,
        t: 0,
        c: c
      });
    }
  }

  function update(dt) {
    for (let i = 0; i < 2; i++) {
      const f = feet[i];
      f.plant = Math.max(0, f.plant - dt);
      f.down = f.sources.size > 0 || f.plant > 0;
      if (state === 'playing' && f.down && !f.prevDown) spawnLandingDust(i);
      f.prevDown = f.down;
    }
    if (resumeGrace > 0) resumeGrace = Math.max(0, resumeGrace - dt);
    updatePalette();

    if (state === 'playing') {
      const anyDown = feet[0].down || feet[1].down;
      const envMul = isTunnel() ? 1.12 : 1;
      const target = anyDown ? (26 + Math.min(24, dist * 0.02)) * envMul : 0;
      speed += (target - speed) * Math.min(1, dt * 8);
      if (!anyDown && speed < 4) speed = 0;
      dist += speed * dt;
      scoreAcc += (speed * dt) / 10 * mult();
      if (Math.floor(scoreAcc) !== score) setScore(Math.floor(scoreAcc));
      bobPhase += speed * dt * 0.22;
      bobY = Math.sin(bobPhase) * 0.9;

      // 失衡：单脚支撑累积，双脚支撑回落（恢复后的保护期内不算）
      const one = feet[0].down !== feet[1].down;
      if (one) {
        if (resumeGrace <= 0) {
          balance += (0.45 + speed * 0.004) * dt;
          if (balance >= 1) {
            balance = 1;
            fall('balance');
          }
        }
      } else {
        balance = Math.max(0, balance - 1.2 * dt);
      }

      // 双脚离地
      const bothUp = !feet[0].down && !feet[1].down;
      if (bothUp) {
        if (resumeGrace <= 0) {
          bothUpT += dt;
          if (bothUpT > BOTH_UP_GRACE) fall('bothup');
        }
      } else {
        bothUpT = 0;
      }

      if (state === 'playing') updateWorld(dt);
    } else if (state === 'falling') {
      fallT += dt;
      speed *= Math.max(0, 1 - dt * 5);
      dist += speed * dt;
      if (fallT >= FALL_TIME) finishOver();
    }

    // 路边景物
    for (const p of props) {
      p.z -= speed * dt;
      if (p.z < Z_NEAR) {
        const np = newProp(Z_FAR + Math.random() * 12);
        p.z = np.z; p.x = np.x; p.h = np.h;
      }
    }

    for (const f of feet) f.bob = Math.max(0, f.bob - dt * 2.6);
    for (const p of particles) {
      p.t += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 180 * dt;
    }
    particles = particles.filter((p) => p.t < p.life);
  }

  /* ---------------- 绘制：天空 / 远景 ---------------- */
  const CLOUDS = [
    { x: 0.06, y: 0.16, s: 1.15, d: 0.45 },
    { x: 0.42, y: 0.10, s: 0.80, d: 0.30 },
    { x: 0.72, y: 0.23, s: 1.00, d: 0.55 },
    { x: 0.92, y: 0.07, s: 0.70, d: 0.24 }
  ];

  function drawSky() {
    // 参考图风格：大块纯色天空，只在地平线附近换一档色
    const split = Math.round((horizon + 2) * 0.88);
    ctx.fillStyle = pal.sky1;
    ctx.fillRect(0, 0, VW, split);
    ctx.fillStyle = pal.sky2;
    ctx.fillRect(0, split, VW, horizon + 2 - split);

    // 太阳 / 月亮：阶梯像素圆
    const sx = Math.round(VW * 0.78);
    const sy = Math.round(horizon * 0.33);
    const r = Math.max(5, Math.round(VW * 0.045));
    const rows = [0.42, 0.78, 1, 1, 1, 0.78, 0.42];
    const rh = Math.max(1, Math.round((r * 2) / rows.length));
    ctx.globalAlpha = 1 - tunnelMix();
    ctx.fillStyle = pal.sun;
    for (let i = 0; i < rows.length; i++) {
      const w = Math.round(r * 2 * rows[i]);
      ctx.fillRect(sx - Math.round(w / 2), sy - r + i * rh, w, rh);
    }
    ctx.globalAlpha = 1;
  }

  function drawCloud(x, y, s) {
    const w = Math.round(20 * s);
    const h = Math.round(7 * s);
    const bx = Math.round(x);
    const by = Math.round(y);
    const parts = [
      [bx, by, w, h],
      [bx + Math.round(5 * s), by - Math.round(4 * s), Math.round(11 * s), Math.round(5 * s)],
      [bx + Math.round(12 * s), by - Math.round(2 * s), Math.round(9 * s), Math.round(4 * s)]
    ];
    // 墨色外轮廓
    ctx.fillStyle = pal.ink;
    for (const p of parts) ctx.fillRect(p[0] - 1, p[1] - 1, p[2] + 2, p[3] + 2);
    ctx.fillStyle = pal.cloud;
    for (const p of parts) ctx.fillRect(p[0], p[1], p[2], p[3]);
    // 平涂的底部暗面
    ctx.fillStyle = pal.cloud2;
    ctx.fillRect(bx + 1, by + h - Math.max(1, Math.round(2 * s)), Math.max(1, w - 2), Math.max(1, Math.round(2 * s)));
  }

  function drawClouds() {
    const tm = tunnelMix();
    const a = 1 - tm;
    if (a <= 0.01) return;
    const span = VW + 60;
    ctx.globalAlpha = a;
    for (const c of CLOUDS) {
      const cx = ((c.x * span - dist * c.d) % span + span) % span - 26;
      drawCloud(cx, horizon * c.y, c.s * (VW / 180));
    }
    ctx.globalAlpha = 1;
  }

  function drawHillLayer(baseY, amp, color, par, phase) {
    const step = 2;
    const pts = [];
    ctx.fillStyle = color;
    for (let x = 0; x < VW; x += step) {
      const xx = x + dist * par + phase * 120;
      const h = Math.round(amp * (0.45 + 0.55 * Math.sin(xx * 0.028)));
      pts.push({ x: x, y: baseY - h });
      ctx.fillRect(x, baseY - h, step, h + 4);
    }
    // 山顶加一条粗墨线，贴近参考图的硬描边
    ctx.strokeStyle = pal.ink;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      if (i === 0) ctx.moveTo(pts[i].x, pts[i].y);
      else ctx.lineTo(pts[i].x, pts[i].y);
    }
    ctx.stroke();
  }

  function drawHills() {
    const tm = tunnelMix();
    drawHillLayer(horizon + 1, 10 + Math.round(6 * (1 - tm)), pal.hill2, 0.6, 0);
    drawHillLayer(horizon + 1, 22 + Math.round(8 * (1 - tm)), pal.hill, 1.15, 1.7);
  }

  // 路面两侧的草地：平涂底色 + 屏幕空间棋盘点阵（参考图的地面纹理）
  function drawGround() {
    ctx.fillStyle = pal.ground;
    ctx.fillRect(0, horizon, VW, VH - horizon);

    ctx.fillStyle = pal.ground2;
    for (let y = horizon; y < VH; y += 4) {
      const row = Math.round((y - horizon) / 4);
      const w = 2 + Math.round((y - horizon) / 30);
      for (let x = (row % 2) * w; x < VW; x += w * 2) {
        ctx.fillRect(x, y, w, 4);
      }
    }
  }

  // 逐扫描线填充：保证路缘是硬像素边，不用抗锯齿路径
  function drawRoad() {
    const z0Beat = 18 + (1 - beatPulse) * 26;
    for (let y = Math.max(horizon + 1, 0); y < VH; y++) {
      const s = (y - horizon - bobY) / CAM_H;
      if (s <= 0) continue;
      const z = FOCAL / s;
      if (z > Z_FAR || z < Z_NEAR) continue;

      const c = project(0, z);
      const half = ROAD_HALF * s;
      const x0 = Math.round(c.x - half);
      const x1 = Math.round(c.x + half);
      const w = x1 - x0;
      if (w < 1) continue;

      const t = z + dist;
      const seam = (t % 14) < 2;
      ctx.fillStyle = seam ? pal.seam : (Math.floor(t / 9) % 2 ? pal.road2 : pal.road);
      ctx.fillRect(x0, y, w, 1);

      // 两侧边线
      const ew = Math.max(1, Math.min(3, Math.round(3 * s / S_HIT)));
      ctx.fillStyle = pal.edge;
      ctx.fillRect(x0, y, ew, 1);
      ctx.fillRect(x1 - ew, y, ew, 1);

      // 中线虚线
      if ((t % 18) < 9) {
        const mw = Math.max(1, Math.round(0.45 * s));
        ctx.globalAlpha = 0.65;
        ctx.fillRect(Math.round(c.x - mw / 2), y, mw, 1);
        ctx.globalAlpha = 1;
      }

      // 节拍地鼓：扫过的亮带
      if (beatPulse > 0.02 && z >= z0Beat && z <= z0Beat + 7) {
        ctx.globalAlpha = beatPulse * 0.4;
        ctx.fillStyle = pal.cloud;
        ctx.fillRect(x0, y, w, 1);
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawProps() {
    const alpha = 1 - tunnelMix() * 0.96;
    if (alpha <= 0.02) return;
    const list = props.slice().sort((p, q) => q.z - p.z);
    for (const p of list) {
      if (p.z <= Z_NEAR) continue;
      const a = project(p.x, p.z);
      if (a.x < -26 || a.x > VW + 26) continue;
      const h = Math.max(4, Math.min(Math.round(p.h * a.s), Math.round(VH * 0.55)));
      const w = Math.max(4, Math.round(h * 0.78));
      const cx = Math.round(a.x);
      const baseY = Math.round(a.y);
      ctx.globalAlpha = alpha;

      // 树干
      const trunkW = Math.max(2, Math.round(w * 0.2));
      const trunkH = Math.round(h * 0.34);
      // 硬边投影
      ctx.fillStyle = pal.ground2;
      ctx.fillRect(Math.round(cx - w * 0.4), baseY - 1, Math.max(3, Math.round(w * 0.8)), 2);
      ctx.fillStyle = pal.ink;
      ctx.fillRect(cx - Math.round(trunkW / 2), baseY - trunkH, trunkW, trunkH);
      ctx.fillStyle = pal.prop2;
      ctx.fillRect(cx - Math.round(trunkW / 2) + 1, baseY - trunkH + 1, Math.max(1, Math.round(trunkW * 0.4)), Math.max(1, trunkH - 2));

      // 树冠：自下而上收窄的阶梯，先整体描边再填色，只留外轮廓
      const layers = [
        { wf: 1.00, hf: 0.26, bf: 0.30 },
        { wf: 0.82, hf: 0.24, bf: 0.48 },
        { wf: 0.60, hf: 0.22, bf: 0.64 },
        { wf: 0.34, hf: 0.18, bf: 0.80 }
      ];
      const box = [];
      for (let i = 0; i < layers.length; i++) {
        const L = layers[i];
        const lw = Math.round(w * L.wf);
        const lh = Math.round(h * L.hf);
        const lx = cx - Math.round(lw / 2);
        const ly = baseY - Math.round(h * (L.bf + L.hf));
        box.push({ lx: lx, ly: ly, lw: lw, lh: lh });
        ctx.fillStyle = pal.ink;
        ctx.fillRect(lx - 2, ly - 2, lw + 4, lh + 4);
      }
      for (let i = 0; i < box.length; i++) {
        const b = box[i];
        ctx.fillStyle = i < 2 ? pal.prop2 : pal.prop;
        ctx.fillRect(b.lx, b.ly, b.lw, b.lh);
      }
      for (let i = 0; i < box.length; i++) {
        const b = box[i];
        ctx.fillStyle = i < 2 ? pal.prop : pal.hill;
        ctx.fillRect(b.lx + 1, b.ly + 1, Math.max(1, Math.round(b.lw * 0.5)), Math.max(1, b.lh - 2));
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawRock(x, y, w, h) {
    const w1 = Math.max(4, Math.round(w));
    const h1 = Math.max(3, Math.round(h));
    const left = Math.round(x - w1 / 2);
    const top = Math.round(y - h1);
    // 深色轮廓
    ctx.fillStyle = pal.ink;
    ctx.fillRect(left + Math.round(w1 * 0.12), top - 1, Math.round(w1 * 0.76), h1 + 1);
    ctx.fillRect(left - 1, top + Math.round(h1 * 0.32), w1 + 2, h1 - Math.round(h1 * 0.32) + 1);
    // 主体
    ctx.fillStyle = '#c6d0d6';
    ctx.fillRect(left + Math.round(w1 * 0.16), top, Math.round(w1 * 0.68), h1);
    ctx.fillRect(left, top + Math.round(h1 * 0.36), w1, h1 - Math.round(h1 * 0.36));
    // 亮面 / 暗面
    ctx.fillStyle = '#e8eef1';
    ctx.fillRect(left + Math.round(w1 * 0.24), top + 1, Math.max(1, Math.round(w1 * 0.26)), Math.max(1, Math.round(h1 * 0.3)));
    ctx.fillStyle = '#93a1ab';
    ctx.fillRect(left + 1, y - Math.max(1, Math.round(h1 * 0.2)), Math.max(1, w1 - 2), Math.max(1, Math.round(h1 * 0.2)));
  }

  function drawCone(x, y, w, h) {
    const w1 = Math.max(4, Math.round(w));
    const h1 = Math.max(4, Math.round(h));
    const rows = 5;
    const rh = Math.max(1, Math.round(h1 / rows));
    for (let i = 0; i < rows; i++) {
      const t = i / (rows - 1);
      const ww = Math.max(2, Math.round(w1 * (0.3 + 0.7 * t)));
      const yy = Math.round(y - h1 + i * rh);
      ctx.fillStyle = pal.ink;
      ctx.fillRect(Math.round(x - ww / 2) - 1, yy, ww + 2, rh);
      ctx.fillStyle = (i === 2) ? '#fffdf4' : DANGER;
      ctx.fillRect(Math.round(x - ww / 2), yy, ww, rh);
    }
    // 底座
    ctx.fillStyle = pal.ink;
    ctx.fillRect(Math.round(x - w1 * 0.62), y - 1, Math.round(w1 * 1.24), 2);
  }

  function drawBarrier(x, y, w, h) {
    const w1 = Math.max(5, Math.round(w));
    const h1 = Math.max(3, Math.round(h));
    const left = Math.round(x - w1 / 2);
    const top = Math.round(y - h1);
    // 板 + 轮廓
    ctx.fillStyle = pal.ink;
    ctx.fillRect(left - 1, top - 1, w1 + 2, h1 + 2);
    ctx.fillStyle = DANGER;
    ctx.fillRect(left, top, w1, h1);
    // 白色警示条
    ctx.fillStyle = '#fff6ea';
    const step = Math.max(3, Math.round(w1 / 5));
    for (let sx = left + 1; sx < left + w1 - 1; sx += step * 2) {
      ctx.fillRect(sx, top + 1, Math.min(step, left + w1 - sx - 1), Math.max(1, h1 - 2));
    }
    // 支腿
    ctx.fillStyle = pal.ink;
    ctx.fillRect(left + 1, y - 1, 2, Math.max(2, Math.round(h1 * 0.5)));
    ctx.fillRect(left + w1 - 3, y - 1, 2, Math.max(2, Math.round(h1 * 0.5)));
  }

  // 弯道路缘：贴地的低矮条纹块
  function drawCurb(x, y, w, h) {
    const w1 = Math.max(6, Math.round(w));
    const h1 = Math.max(3, Math.round(h));
    const left = Math.round(x - w1 / 2);
    const top = Math.round(y - h1);
    ctx.fillStyle = pal.ink;
    ctx.fillRect(left - 1, top - 1, w1 + 2, h1 + 2);
    ctx.fillStyle = DANGER;
    ctx.fillRect(left, top, w1, h1);
    ctx.fillStyle = '#fff6ea';
    const step = Math.max(3, Math.round(w1 / 6));
    for (let sx = left + 1; sx < left + w1 - 1; sx += step * 2) {
      ctx.fillRect(sx, top + 1, Math.min(step, left + w1 - sx - 1), Math.max(1, h1 - 2));
    }
    ctx.fillStyle = pal.ink;
    ctx.fillRect(left, y, w1, 1);
  }

  function drawObjects() {
    const list = obstacles.slice().sort((a, b) => b.z - a.z);
    for (const it of list) {
      if (it.z < HIT_Z + 0.5) continue;
      const xw = it.lane === 0 ? -LANE : LANE;
      const p = project(xw, it.z);
      if (p.x < -40 || p.x > VW + 40) continue;

      if (it.z < 60) {
        ctx.globalAlpha = Math.max(0, 0.16 * (1 - it.z / 60));
        ctx.fillStyle = pal.ink;
        ctx.fillRect(Math.round(p.x - 4 * p.s * 0.4), Math.round(p.y - 1), Math.max(1, Math.round(8 * p.s * 0.4)), 1);
        ctx.globalAlpha = 1;
      }

      const w = it.wf * LANE * p.s;
      const h = it.hf * LANE * p.s;
      if (it.type === 'rock') drawRock(p.x, p.y, w, h);
      else if (it.type === 'cone') drawCone(p.x, p.y, w, h);
      else if (it.type === 'curb') drawCurb(p.x, p.y, w, h);
      else drawBarrier(p.x, p.y, w, h);
    }
  }

  /* ---------------- 玩家：背对镜头的小猪 ---------------- */
  const PIG = { skin:'#ffa6c1', light:'#ffd3df', skin2:'#ee8aa9', maroon:'#6b3a45',
    denim:'#5b7fd4', denim2:'#3e5fac', denim3:'#7c9be6', gold:'#ffc94a', orange:'#ff8a5b',
    helm:'#8294b0', helm2:'#a7b8ce', helm3:'#5f7189', cyan:'#8fe6f8', collar:'#2b3245' };

  function pigU() { return Math.max(0.55, Math.min(1.15, VH / 390)); }

  // 粗像素肢体（带墨色描边）
  function pigLimb(x1, y1, x2, y2, w) {
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.max(1, Math.hypot(dx, dy));
    ctx.save();
    ctx.translate((x1 + x2) / 2, (y1 + y2) / 2);
    ctx.rotate(Math.atan2(dy, dx));
    ctx.fillStyle = pal.ink;
    ctx.fillRect(-len / 2 - 1, -w / 2 - 1, len + 2, w + 2);
    ctx.fillStyle = PIG.skin;
    ctx.fillRect(-len / 2, -w / 2, len, w);
    ctx.restore();
  }

  // 左右对称的像素圆块：先描边再填色，只留外轮廓
  function pigBlob(cx, top, rows, fill, shade, ow) {
    const o = Math.max(1, Math.round(ow || 1));
    let y = Math.round(top);
    const boxes = [];
    for (const r of rows) {
      const w = Math.max(2, Math.round(r.w));
      const h = Math.max(1, Math.round(r.h));
      const x = Math.round(cx - w / 2);
      ctx.fillStyle = pal.ink;
      ctx.fillRect(x - o, y - o, w + o * 2, h + o * 2);
      boxes.push({ x: x, y: y, w: w, h: h });
      y += h;
    }
    for (const b of boxes) {
      ctx.fillStyle = fill;
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }
    if (shade && boxes.length) {
      // 右缘 + 底缘的硬边暗面，模仿参考图
      for (let i = 2; i < boxes.length; i++) {
        const b = boxes[i];
        ctx.fillStyle = shade;
        ctx.fillRect(b.x + b.w - o, b.y, o, b.h);
      }
      const last = boxes[boxes.length - 1];
      ctx.fillStyle = shade;
      ctx.fillRect(last.x + o, last.y + Math.max(0, last.h - o), Math.max(1, last.w - o * 2), o);
    }
    return boxes;
  }

  // 像素圆盘：用逐行 fillRect 画，避免 arc 的抗锯齿破坏像素感
  function pixelDisc(x, y, r, color) {
    const R = Math.max(1, Math.round(r));
    ctx.fillStyle = color;
    for (let dy = -R; dy <= R; dy++) {
      const half = Math.round(Math.sqrt(Math.max(0, R * R - dy * dy)));
      if (half <= 0) continue;
      ctx.fillRect(Math.round(x) - half, Math.round(y) + dy, half * 2, 1);
    }
  }

  // 侧后方视角的四轮旱冰鞋：靴筒在脚跟一侧，鞋头朝外
  function drawPigSkate(x, y, u, side) {
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));
    ctx.scale(side * 1.2, 1.2);

    // 轮子（橙色大轮 + 奶油轮毂）
    for (const wx of [-3.9, 3.7]) {
      ctx.fillStyle = pal.ink;
      ctx.beginPath();
      ctx.arc(Math.round(wx * u), Math.round(-2.6 * u), Math.max(2, Math.round(3.1 * u)), 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = PIG.orange;
      ctx.beginPath();
      ctx.arc(Math.round(wx * u), Math.round(-2.6 * u), Math.max(1, Math.round(2.35 * u)), 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fffdf4';
      ctx.beginPath();
      ctx.arc(Math.round(wx * u), Math.round(-2.6 * u), Math.max(1, Math.round(1.1 * u)), 0, Math.PI * 2);
      ctx.fill();
    }

    // 底板
    ctx.fillStyle = pal.ink;
    ctx.fillRect(Math.round(-6.6 * u), Math.round(-7.2 * u), Math.max(6, Math.round(13.2 * u)), Math.max(2, Math.round(2.6 * u)));
    ctx.fillStyle = PIG.denim2;
    ctx.fillRect(Math.round(-5.8 * u), Math.round(-6.7 * u), Math.max(4, Math.round(11.6 * u)), Math.max(1, Math.round(1.4 * u)));

    // 靴身：前掌 + 高帮
    ctx.fillStyle = pal.ink;
    ctx.fillRect(Math.round(-5.8 * u) - 1, Math.round(-9.8 * u) - 1, Math.max(6, Math.round(11 * u)) + 2, Math.max(2, Math.round(3 * u)) + 2);
    ctx.fillRect(Math.round(-5.8 * u) - 1, Math.round(-15 * u) - 1, Math.max(4, Math.round(6.2 * u)) + 2, Math.max(4, Math.round(6.6 * u)) + 2);
    ctx.fillStyle = '#fffdf4';
    ctx.fillRect(Math.round(-5.8 * u), Math.round(-9.8 * u), Math.max(6, Math.round(11 * u)), Math.max(2, Math.round(3 * u)));
    ctx.fillRect(Math.round(-5.8 * u), Math.round(-15 * u), Math.max(4, Math.round(6.2 * u)), Math.max(4, Math.round(6.6 * u)));

    // 栗色靴口 + 蓝色搭扣带
    ctx.fillStyle = PIG.maroon;
    ctx.fillRect(Math.round(-5.8 * u), Math.round(-15 * u), Math.max(4, Math.round(6.2 * u)), Math.max(1, Math.round(2.6 * u)));
    ctx.fillStyle = PIG.denim;
    ctx.fillRect(Math.round(-5.8 * u), Math.round(-11.6 * u), Math.max(4, Math.round(6.2 * u)), Math.max(1, Math.round(1.4 * u)));

    // 鞋头刹车
    ctx.fillStyle = PIG.orange;
    ctx.fillRect(Math.round(4.6 * u), Math.round(-6.6 * u), Math.max(1, Math.round(2.2 * u)), Math.max(1, Math.round(1.8 * u)));

    ctx.restore();
  }

  function supportSide() {
    if (feet[0].down && !feet[1].down) return 0;
    if (feet[1].down && !feet[0].down) return 1;
    return -1;
  }

  function drawBalanceRing(x, y) {
    const cx = Math.round(x);
    const cy = Math.round(y - 5);
    const r = Math.round(14 + balance * 6);
    const now = performance.now();
    const fade = Math.min(1, balance / 0.12);

    // 柔和底盘
    ctx.globalAlpha = (0.07 + balance * 0.12) * fade;
    ctx.fillStyle = DANGER;
    ctx.beginPath();
    ctx.arc(cx, cy, Math.max(1, r - 1), 0, Math.PI * 2);
    ctx.fill();

    // 完整细环
    ctx.globalAlpha = 0.3 * fade;
    ctx.strokeStyle = pal.ink;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();

    // 橙色进度：从正上方顺时针扫满
    const a0 = -Math.PI / 2;
    ctx.globalAlpha = (0.85 + balance * 0.15) * fade;
    ctx.strokeStyle = DANGER;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, r, a0, a0 + Math.PI * 2 * Math.min(1, balance), false);
    ctx.stroke();

    // 临界闪烁外圈
    if (balance > 0.7) {
      ctx.globalAlpha = 0.4 * (0.5 + 0.5 * Math.sin(now * 0.022));
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, r + 3, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // 单脚支撑时头顶的叹号，随失衡值变大、跳动
  function drawWarnBang(x, topY, su) {
    if (balance < 0.2) return;
    const k = Math.min(1, (balance - 0.2) / 0.45);
    const now = performance.now();
    const pulse = 0.75 + 0.25 * Math.sin(now * 0.018);
    const s = Math.max(1, Math.round(su || 1));
    const w = 2 * s;
    const barH = 8 * s;
    const gap = 3 * s;
    const dotH = 3 * s;
    const cx = Math.round(x);
    const top = Math.round(topY - Math.sin(now * 0.012) * 2);

    ctx.globalAlpha = k * pulse;
    // 墨色描边
    ctx.fillStyle = pal.ink;
    ctx.fillRect(cx - w - 1, top - 1, w * 2 + 2, barH + 2);
    ctx.fillRect(cx - w - 1, top + barH + gap - 1, w * 2 + 2, dotH + 2);
    // 橙色主体
    ctx.fillStyle = DANGER;
    ctx.fillRect(cx - w, top, w * 2, barH);
    ctx.fillRect(cx - w, top + barH + gap, w * 2, dotH);
    // 左上高光
    ctx.fillStyle = '#ffd9c2';
    ctx.fillRect(cx - w, top, 1, barH);
    ctx.globalAlpha = 1;
  }

  function drawPigFigure(flail) {
    const u = pigU();
    const cx = VW / 2;
    const ground = skateY;
    const playing = state === 'playing' && !flail;
    const ss = playing ? supportSide() : -1;
    const now = performance.now();

    const down0 = flail ? false : (feet[0].down || state === 'ready');
    const down1 = flail ? false : (feet[1].down || state === 'ready');
    const bothUp = flail || (!down0 && !down1);

    const idle = (state === 'ready') ? Math.sin(now * 0.0025) * 0.9 * u : 0;
    const bob = Math.max(feet[0].bob, feet[1].bob) * 2.2 * u + idle;
    const sway = (down0 || down1) ? Math.sin(bobPhase * 2) * 0.9 * u : 0;
    const lean = (playing && ss >= 0 && balance > 0.02)
      ? (ss === 0 ? -1 : 1) * balance * 5 * u
      : 0;
    const shift = lean + sway;

    const air = bothUp ? 3 * u : 0;
    const bodyBottom = ground - 22 * u - bob - air;
    const bodyTop = bodyBottom - 62 * u;
    const headTop = bodyTop - 18 * u;
    const shCol = mixHex(pal.road2, pal.ink, 0.26);

    // 地面影子：平涂色块，不用渐变
    const gy = Math.round(ground);
    ctx.fillStyle = shCol;
    ctx.fillRect(Math.round(cx - 31 * u), gy, Math.round(62 * u), Math.max(1, Math.round(2 * u)));
    ctx.fillRect(Math.round(cx - 25 * u), gy + Math.max(1, Math.round(2 * u)), Math.round(50 * u), Math.max(1, Math.round(1 * u)));

    // 腿与旱冰鞋
    const wob = (playing && ss >= 0 && balance > 0.45)
      ? Math.round(Math.sin(now * 0.05) * (balance - 0.45) * 5 * u)
      : 0;

    for (let i = 0; i < 2; i++) {
      const dir = i === 0 ? -1 : 1;
      const down = i === 0 ? down0 : down1;
      const baseX = cx + dir * 23 * u;
      const footX = baseX + (ss === i ? wob : 0) - (down ? 0 : dir * 2 * u);
      const lift = down ? 0 : (bothUp ? 10 * u : 14 * u);
      const footY = ground - lift;
      const hipX = cx + dir * 19 * u + shift;
      const hipY = bodyBottom + 2 * u;

      if (down) {
        const kneeX = hipX + (footX - hipX) * 0.35 + dir * 2 * u;
        const kneeY = hipY + (footY - hipY) * 0.55;
        pigLimb(hipX, hipY, kneeX, kneeY, Math.max(4, Math.round(10 * u)));
        pigLimb(kneeX, kneeY, footX, footY - 9 * u, Math.max(4, Math.round(10 * u)));
      } else {
        const kneeX = hipX + (footX - hipX) * 0.45 + dir * 2 * u;
        const kneeY = hipY + (footY - hipY) * 0.55;
        pigLimb(hipX, hipY, kneeX, kneeY, Math.max(4, Math.round(10 * u)));
        pigLimb(kneeX, kneeY, footX, footY - 8 * u, Math.max(3, Math.round(9 * u)));
      }

      ctx.fillStyle = shCol;
      ctx.fillRect(Math.round(baseX - 7 * u), Math.round(ground - 1), Math.round(14 * u), Math.max(1, Math.round(2 * u)));
      drawPigSkate(footX, footY, u, i === 0 ? -1 : 1);
    }

    // 身体：参考图的大圆屁股
    const bodyRows = [
      { w: 14 * u, h: 2 * u },
      { w: 22 * u, h: 3 * u },
      { w: 30 * u, h: 3 * u },
      { w: 38 * u, h: 4 * u },
      { w: 46 * u, h: 5 * u },
      { w: 54 * u, h: 5 * u },
      { w: 60 * u, h: 6 * u },
      { w: 62 * u, h: 7 * u },
      { w: 62 * u, h: 7 * u },
      { w: 60 * u, h: 6 * u },
      { w: 54 * u, h: 5 * u },
      { w: 46 * u, h: 4 * u },
      { w: 36 * u, h: 3 * u },
      { w: 26 * u, h: 2 * u }
    ];
    pigBlob(cx + shift, bodyTop, bodyRows, PIG.skin, PIG.skin2, 2);

    // 左上高光
    ctx.fillStyle = PIG.light;
    {
      const hx0 = Math.round(cx + shift - 19 * u);
      const hy0 = Math.round(bodyTop + 8 * u);
      ctx.fillRect(hx0 + 2 * u, hy0, 4 * u, 2 * u);
      ctx.fillRect(hx0, hy0 + 2 * u, 8 * u, 10 * u);
      ctx.fillRect(hx0 + 2 * u, hy0 + 12 * u, 4 * u, 2 * u);
      ctx.fillRect(hx0 + 3 * u, hy0 + 14 * u, 2 * u, Math.max(1, Math.round(2 * u)));
    }

    // 卷尾：屁股中央的像素同心螺旋
    const tx = cx + shift;
    const ty = bodyTop + 25.5 * u;
    pixelDisc(tx, ty, 7 * u, pal.ink);
    pixelDisc(tx, ty, 5.2 * u, PIG.skin);
    pixelDisc(tx, ty, 3.2 * u, pal.ink);
    pixelDisc(tx, ty, 1.5 * u, PIG.light);

    // 牛仔短背带裤：贴着大圆屁股的下半部分
    const shortsTop = bodyTop + 42 * u;
    const shortRows = [
      { w: 60 * u, h: 6 * u },
      { w: 54 * u, h: 5 * u }, { w: 46 * u, h: 4 * u },
      { w: 36 * u, h: 3 * u }, { w: 26 * u, h: 2 * u }
    ];
    pigBlob(cx + shift, shortsTop, shortRows, PIG.denim, PIG.denim2, 1);
    // 裤腰
    pigBlob(cx + shift, bodyTop + 38.5 * u, [{ w: 62 * u, h: 3 * u }], PIG.denim2, null, 1);

    // 背带
    for (const dir of [-1, 1]) {
      const sw = Math.max(3, Math.round(5 * u));
      const sx = Math.round(cx + shift + dir * 10 * u - sw / 2);
      const sy0 = Math.round(bodyTop + 4 * u);
      const sy1 = Math.round(bodyTop + 39 * u);
      ctx.fillStyle = pal.ink;
      ctx.fillRect(sx - 1, sy0 - 1, sw + 2, sy1 - sy0 + 2);
      ctx.fillStyle = PIG.denim;
      ctx.fillRect(sx, sy0, sw, sy1 - sy0);
      ctx.fillStyle = PIG.denim3;
      ctx.fillRect(sx + 1, sy0, 1, sy1 - sy0);
    }

    // 背带扣
    for (const dir of [-1, 1]) {
      const bw = Math.max(2, Math.round(3 * u));
      const bx0 = Math.round(cx + shift + dir * 10 * u - bw / 2);
      const by0 = Math.round(bodyTop + 37 * u);
      ctx.fillStyle = pal.ink;
      ctx.fillRect(bx0 - 1, by0 - 1, bw + 2, bw + 2);
      ctx.fillStyle = PIG.gold;
      ctx.fillRect(bx0, by0, bw, bw);
    }

    // 屁股口袋
    for (const dir of [-1, 1]) {
      const pw = Math.max(5, Math.round(9 * u));
      const ph = Math.max(4, Math.round(6 * u));
      const px0 = Math.round(cx + shift + dir * 17 * u - pw / 2);
      const py0 = Math.round(bodyTop + 48 * u);
      ctx.fillStyle = pal.ink;
      ctx.fillRect(px0 - 1, py0 - 1, pw + 2, ph + 2);
      ctx.fillStyle = PIG.denim2;
      ctx.fillRect(px0, py0, pw, ph);
      ctx.fillStyle = PIG.denim3;
      ctx.fillRect(px0, py0, pw, 1);
    }

    // 大圆垂耳：先画，头盔随后盖住耳根
    for (const dir of [-1, 1]) {
      const ex = cx + shift + dir * 20 * u;
      const ey = headTop + 5 * u;
      const earRows = [
        { w: 5 * u, h: 2 * u }, { w: 9 * u, h: 2 * u }, { w: 13 * u, h: 3 * u },
        { w: 15 * u, h: 3 * u }, { w: 15 * u, h: 3 * u }, { w: 13 * u, h: 2 * u },
        { w: 10 * u, h: 2 * u }, { w: 6 * u, h: 2 * u }
      ];
      pigBlob(ex + dir * 1 * u, ey, earRows, PIG.skin, null, 1);
      // 内耳：不描边，只铺一层深粉
      const innerRows = [
        { w: 2 * u, h: 2 * u }, { w: 4 * u, h: 2 * u }, { w: 5 * u, h: 2 * u },
        { w: 5 * u, h: 2 * u }, { w: 4 * u, h: 2 * u }, { w: 2 * u, h: 2 * u }
      ];
      let innerY = Math.round(ey + 6 * u);
      for (const r of innerRows) {
        ctx.fillStyle = PIG.skin2;
        ctx.fillRect(Math.round(ex + dir * 2 * u - r.w / 2), innerY, Math.max(1, Math.round(r.w)), Math.max(1, Math.round(r.h)));
        innerY += Math.max(1, Math.round(r.h));
      }
    }

    // 参考图的蓝灰头罩
    const headRows = [
      { w: 12 * u, h: 2 * u },
      { w: 22 * u, h: 3 * u },
      { w: 28 * u, h: 4 * u },
      { w: 32 * u, h: 4 * u },
      { w: 34 * u, h: 4 * u },
      { w: 32 * u, h: 3 * u },
      { w: 26 * u, h: 2 * u },
      { w: 18 * u, h: 2 * u }
    ];
    pigBlob(cx + shift, headTop, headRows, PIG.helm, PIG.helm3, 2);

    // 头顶青色高光
    ctx.fillStyle = PIG.cyan;
    ctx.fillRect(Math.round(cx + shift - 13 * u), Math.round(headTop + 5 * u), Math.max(1, Math.round(5 * u)), Math.max(1, Math.round(8 * u)));
    ctx.fillRect(Math.round(cx + shift - 10 * u), Math.round(headTop + 3 * u), Math.max(1, Math.round(4 * u)), Math.max(1, Math.round(3 * u)));
    ctx.fillStyle = PIG.helm2;
    ctx.fillRect(Math.round(cx + shift - 6 * u), Math.round(headTop + 3 * u), Math.max(1, Math.round(4 * u)), Math.max(1, Math.round(2 * u)));

    // 头罩上的两个深色圆点
    ctx.fillStyle = pal.ink;
    ctx.fillRect(Math.round(cx + shift - 7 * u), Math.round(headTop + 14 * u), Math.max(1, Math.round(2 * u)), Math.max(1, Math.round(3 * u)));
    ctx.fillRect(Math.round(cx + shift + 5 * u), Math.round(headTop + 14 * u), Math.max(1, Math.round(2 * u)), Math.max(1, Math.round(3 * u)));

    // 颈圈 + 右侧垂下的扣带
    {
      const neckY = Math.round(headTop + 22 * u);
      const neckW = Math.max(8, Math.round(30 * u));
      ctx.fillStyle = pal.ink;
      ctx.fillRect(Math.round(cx + shift - neckW / 2) - 1, neckY - 1, neckW + 2, Math.max(2, Math.round(1.6 * u)) + 2);
      ctx.fillStyle = PIG.collar;
      ctx.fillRect(Math.round(cx + shift - neckW / 2), neckY, neckW, Math.max(1, Math.round(1.2 * u)));

      // 右侧斜垂的扣带（参考图里那条垂下来的带子）
      const sx = Math.round(cx + shift + 12 * u);
      const sy = neckY + Math.max(1, Math.round(1.2 * u));
      const sw = Math.max(2, Math.round(3 * u));
      const shh = Math.max(2, Math.round(2.4 * u));
      const segN = 5;
      for (let i = 0; i < segN; i++) {
        const px = sx + Math.round(i * 1.7 * u);
        const py = sy + i * shh;
        ctx.fillStyle = pal.ink;
        ctx.fillRect(px - 1, py - 1, sw + 2, shh + 2);
      }
      for (let i = 0; i < segN; i++) {
        const px = sx + Math.round(i * 1.7 * u);
        const py = sy + i * shh;
        ctx.fillStyle = PIG.collar;
        ctx.fillRect(px, py, sw, shh);
      }
      // 末端浅色扣件
      const bx2 = sx + Math.round((segN - 1) * 1.7 * u);
      const by2 = sy + segN * shh - Math.max(1, Math.round(1 * u));
      const bh2 = Math.max(2, Math.round(2.4 * u));
      ctx.fillStyle = pal.ink;
      ctx.fillRect(bx2 - 1, by2 - 1, sw + 2, bh2 + 2);
      ctx.fillStyle = PIG.helm2;
      ctx.fillRect(bx2, by2, sw, bh2);
    }

    // 失衡提示：支撑脚光环 + 头顶叹号
    if (playing && ss >= 0 && balance > 0.03) {
      drawBalanceRing(cx + (ss === 0 ? -23 : 23) * u, ground);
      drawWarnBang(cx + shift, headTop - 17 * u, u);
    }
  }

  function drawPlayer(tilt) {
    if (state === 'falling' || state === 'over') {
      const t = state === 'over' ? 1 : Math.min(1, fallT / FALL_TIME);
      const e = t * t * (3 - 2 * t);
      const dir = (fallCause === 'bothup' || fallCause === 'hit') ? 1 : -1;
      ctx.save();
      ctx.translate(VW / 2, skateY);
      ctx.rotate(e * 0.55 * dir);
      ctx.translate(-VW / 2, -skateY - e * 4);
      drawPigFigure(true);
      ctx.restore();
      return;
    }
    ctx.save();
    ctx.translate(VW / 2, skateY);
    ctx.rotate(tilt);
    ctx.translate(-VW / 2, -skateY);
    drawPigFigure(false);
    ctx.restore();
  }

  function drawTunnel() {
    const tm = tunnelMix();
    if (tm < 0.01) return;
    const cx = VW / 2;
    const cy = horizon + VH * 0.14;
    const rx = VW * 0.58;
    const ry = VH * 0.56;

    // 只处理地平线以上的天空区域，避免遮住近处路面
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, VW, horizon + 1);
    ctx.clip();

    // 洞口遮罩：洞口以外压暗
    ctx.globalAlpha = tm * 0.92;
    ctx.fillStyle = '#080b11';
    ctx.beginPath();
    ctx.rect(0, 0, VW, VH);
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2, true);
    ctx.fill();

    // 拱肋：由外向内收，制造纵深
    ctx.strokeStyle = '#3d4657';
    ctx.lineWidth = 1;
    for (let i = 1; i <= 3; i++) {
      const k = 1 - i * 0.13;
      ctx.globalAlpha = tm * (0.3 - i * 0.07);
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx * k, ry * k, 0, Math.PI, Math.PI * 2, false);
      ctx.stroke();
    }

    // 洞口边缘（只画拱顶）
    ctx.globalAlpha = tm * 0.45;
    ctx.strokeStyle = '#5b6678';
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, Math.PI, Math.PI * 2, false);
    ctx.stroke();

    // 洞壁灯带：沿拱顶排布，随节拍呼吸
    const glow = 0.4 + beatPulse * 0.6;
    for (let i = 0; i < 7; i++) {
      const a = Math.PI * (1.03 + i * 0.94 / 6);
      const lx = Math.round(cx + Math.cos(a) * rx * 0.985);
      const ly = Math.round(cy + Math.sin(a) * ry * 0.985);
      ctx.globalAlpha = tm * glow * 0.25;
      ctx.fillStyle = '#ffcf7a';
      ctx.fillRect(lx - 3, ly - 2, 7, 5);
      ctx.globalAlpha = tm * glow;
      ctx.fillStyle = '#ffdca0';
      ctx.fillRect(lx - 1, ly - 1, 4, 2);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawEffects() {
    const now = performance.now() / 1000;

    // 速度线
    if (speed > 34) {
      const a = Math.min(0.16, (speed - 34) / 90);
      ctx.globalAlpha = a;
      ctx.fillStyle = pal.ink;
      for (let i = 0; i < 6; i++) {
        const yy = horizon + 14 + ((i * 37 + Math.floor(dist * 3)) % (VH - horizon - 20));
        const xx = (i % 2 === 0) ? 4 : VW - 26;
        ctx.fillRect(xx, yy, 10 + (i % 3) * 4, 1);
      }
      ctx.globalAlpha = 1;
    }

    // 雨：段落两端淡入淡出
    const rain = rainAmt() * (1 - tunnelMix());
    if (rain > 0.01) {
      ctx.globalAlpha = 0.16 * rain;
      ctx.strokeStyle = pal.ink;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i < 14; i++) {
        const seed = i * 97.3;
        const x = ((seed * 7 + now * 70) % (VW + 20)) - 10;
        const y = ((seed * 13 + now * 300) % (VH + 20)) - 10;
        ctx.moveTo(x, y);
        ctx.lineTo(x - 2, y + 5);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // 失衡警示：越接近摔倒，两侧橙光越强并随心跳闪动
    if (state === 'playing' && balance > 0.42) {
      const k = Math.min(1, (balance - 0.42) / 0.58);
      const pulse = 0.6 + 0.4 * Math.sin(performance.now() * 0.014);
      const wpx = 2 + Math.round(k * 4);
      ctx.globalAlpha = (0.1 + 0.5 * k) * pulse * Math.min(1, k * 4);
      ctx.fillStyle = DANGER;
      ctx.fillRect(0, 0, wpx, VH);
      ctx.fillRect(VW - wpx, 0, wpx, VH);
      ctx.fillRect(0, 0, VW, Math.max(1, Math.round(k * 2)));
      ctx.globalAlpha = 0.08 * k;
      ctx.fillRect(0, VH - 2, VW, 2);
      ctx.globalAlpha = 1;
    }

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
      ctx.fillStyle = p.c || pal.ink;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2);
    }
    ctx.globalAlpha = 1;

    if (state === 'falling') {
      const t = Math.min(1, fallT / FALL_TIME);
      ctx.globalAlpha = t * 0.35;
      ctx.fillStyle = pal.ink;
      ctx.fillRect(0, 0, VW, Math.round(2 + t * 6));
      ctx.fillRect(0, VH - Math.round(2 + t * 6), VW, Math.round(2 + t * 6));
      ctx.globalAlpha = 1;
    }
  }

  /* ---------------- 渲染 ---------------- */
  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, VW, VH);

    drawSky();
    drawClouds();
    drawGround();
    drawHills();

    const t = Math.min(1, state === 'over' ? 1 : (state === 'falling' ? fallT / FALL_TIME : 0));
    const fe = t * t * (3 - 2 * t);

    // 失衡：镜头向支撑脚方向倾斜，重心越偏越明显
    const bs = state === 'playing' ? supportSide() : -1;
    let leanX = 0, tilt = 0, shakeX = 0;
    if (bs >= 0 && balance > 0.02) {
      const dir = bs === 0 ? -1 : 1;
      leanX = dir * balance * 9;
      if (balance > 0.68) {
        shakeX = Math.sin(performance.now() * 0.05) * (balance - 0.68) * 8;
      }
    }

    ctx.save();
    ctx.translate(leanX + shakeX, 0);
    if (curveAmt > 0.001 && curve) {
      const roll = curveAmt * (curve.side === 0 ? -0.08 : 0.08);
      ctx.translate(VW / 2, horizon * 1.3);
      ctx.rotate(roll);
      ctx.translate(-VW / 2, -horizon * 1.3);
    }
    if (fe > 0) {
      ctx.translate(VW / 2, VH * 0.72);
      ctx.rotate(fe * 0.13);
      ctx.translate(-VW / 2, -VH * 0.72);
      ctx.translate(0, fe * 12);
    }
    drawRoad();
    drawProps();
    drawObjects();
    drawTunnel();
    ctx.restore();

    drawPlayer(tilt);
    drawEffects();
  }

  /* ---------------- 主循环 ---------------- */
  let lastTime = 0;

  function frame(now) {
    const raw = Math.min(0.05, (now - lastTime) / 1000 || 0);
    lastTime = now;
    if (freezeT > 0) {
      freezeT = Math.max(0, freezeT - raw);
    } else if (!paused) {
      update(raw);
    }
    render();
    requestAnimationFrame(frame);
  }

  setMuted(muted);
  resize();
  reset();
  showReady();
  requestAnimationFrame((t) => {
    lastTime = t;
    frame(t);
  });
})();
</script>
</body>
</html>
