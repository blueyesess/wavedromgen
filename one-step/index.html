<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>一步</title>
<style>
  :root { --ink:#111111; --paper:#ffffff; --danger:#FF5A1F; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    margin:0; height:100%; background:#fff; overflow:hidden;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none;
  }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color:#111; }
  canvas {
    display:block; position:fixed; inset:0; width:100%; height:100%;
    image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action:none;
  }
  #hud {
    position:fixed; top:calc(env(safe-area-inset-top) + 14px); left:0; right:0;
    text-align:center; font-size:18px; letter-spacing:.2em; opacity:.75;
    pointer-events:none; font-variant-numeric:tabular-nums;
    transition:color .4s linear;
  }
  #overlay {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px; text-align:center;
    pointer-events:none; transition:opacity .16s ease;
  }
  #overlay.hide { opacity:0; }
  #overlay::before {
    content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
    background: radial-gradient(ellipse at 50% 50%, rgba(255,255,255,.94) 0%, rgba(255,255,255,.72) 30%, rgba(255,255,255,0) 62%);
  }
  #overlay > * { position:relative; z-index:1; }
  .big { font-size:min(17vw, 76px); font-weight:500; letter-spacing:.04em; line-height:1; font-variant-numeric:tabular-nums; }
  .sub { font-size:12px; letter-spacing:.14em; opacity:.55; }
  .hint { margin-top:8px; font-size:11px; letter-spacing:.3em; opacity:.35; animation:breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity:.18 } 50% { opacity:.55 } }
  @media (prefers-reduced-motion: reduce) { .hint { animation:none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">0</div>
<div id="overlay">
  <div class="big">一步</div>
  <div class="sub">按住向前滑 · 抬脚越过障碍</div>
  <div class="hint">按住开始</div>
</div>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const hud = document.getElementById('hud');
  const overlay = document.getElementById('overlay');

  const PAPER = '#ffffff';
  const DANGER = '#FF5A1F';

  /* ---------------- 世界参数 ---------------- */
  const Z_FAR = 150;
  const Z_NEAR = 8;
  const HIT_Z = 10;
  const BOTH_UP_GRACE = 0.16;
  const FALL_TIME = 0.82;
  const BEAT = 0.5;          // 120 BPM

  let VW = 180, VH = 320, DPR = 1;
  let horizon = 0, FOCAL = 0, S_HIT = 1;
  let LANE = 2.2, ROAD_HALF = 8, CAM_H = 9.2;
  let skateL = 0, skateR = 0, skateY = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function approach(v, target, k) { return v + (target - v) * clamp(k, 0, 1); }

  /* ---------------- 配色段落 ---------------- */
  const PALETTES = [
    { sky:'#ffffff', sky2:'#f6f6f1', buildA:'#ededE7', buildB:'#f6f6f1', road:'#eaeae2', seam:'#dcdad1', line:'#cfcec4', prop:'#d5d5cf', propTop:'#6f6f69', ink:'#111111' },
    { sky:'#fff5e9', sky2:'#ffe9d2', buildA:'#f2d8c1', buildB:'#fbe8d7', road:'#f0ddca', seam:'#e2cdb7', line:'#d3bca2', prop:'#e6cbb3', propTop:'#8a6a55', ink:'#3a2418' },
    { sky:'#191b24', sky2:'#222532', buildA:'#2a2e3f', buildB:'#333850', road:'#242836', seam:'#1d202c', line:'#3f465c', prop:'#394056', propTop:'#7d86a3', ink:'#e8e9ef' },
    { sky:'#e8ecef', sky2:'#dde3e8', buildA:'#cfd6dc', buildB:'#dee4e9', road:'#d6dde2', seam:'#c3ccd3', line:'#aab5bd', prop:'#b9c3ca', propTop:'#6d7a84', ink:'#1b2429' }
  ];
  const TUNNEL_PAL = { sky:'#14161d', sky2:'#181b23', buildA:'#1d2029', buildB:'#242833', road:'#20232c', seam:'#191c24', line:'#3a4152', prop:'#2a2f3c', propTop:'#6a7386', ink:'#eceef5' };
  const PAL_KEYS = ['sky','sky2','buildA','buildB','road','seam','line','prop','propTop','ink'];
  let pal = PALETTES[0];

  function hx(c) { return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)]; }
  function mixPal(a, b, t) {
    const o = {};
    for (const k of PAL_KEYS) {
      const A = hx(a[k]), B = hx(b[k]);
      o[k] = 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * t) + ',' +
                    Math.round(A[1] + (B[1] - A[1]) * t) + ',' +
                    Math.round(A[2] + (B[2] - A[2]) * t) + ')';
    }
    return o;
  }

  /* ---------------- 状态 ---------------- */
  const feet = [
    { sources: new Set(), down: false, bob: 0 },
    { sources: new Set(), down: false, bob: 0 }
  ];

  let state = 'ready'; // ready | playing | falling | over
  let dist = 0;
  let speed = 0;
  let bothUpT = 0;
  let obstacles = [];
  let props = [];
  let particles = [];
  let score = 0;
  let scoreAcc = 0;
  let best = 0;
  let fallT = 0;
  let overAt = 0;
  let bobPhase = 0;
  let bobY = 0;
  let fallCause = '';

  // 失衡
  let balance = 0;
  let prevBoth = false;
  let playTime = 0;

  // 双踩蓄力 / 冲刺
  let charge = 0;
  let chargeReady = false;
  let dashT = 0;

  // 连击
  let combo = 0;

  // 弯道
  let curve = null;
  let curveAmt = 0;
  let nextCurveAt = 170;

  // 节奏
  let beatAcc = 0;
  let beatPulse = 0;
  let beatCountdown = 2.5;

  try { best = parseInt(localStorage.getItem('yibu.best.score') || '0', 10) || 0; } catch (e) {}

  /* ---------------- 音频 ---------------- */
  let ac = null, master = null;

  function audio() {
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    if (ac.state === 'suspended') ac.resume();
    master = ac.createGain();
    master.gain.value = 0.2;
    master.connect(ac.destination);
  }

  function blip(freq, dur, type, vol, slideTo, delay) {
    if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }

  function sfxStep(side) { blip(side === 0 ? 220 : 165, 0.06, 'square', 0.35); }
  function sfxPass() { blip(520, 0.035, 'square', 0.14); }
  function sfxDash() { blip(180, 0.18, 'sawtooth', 0.28, 620); }
  function sfxTick() { blip(90, 0.02, 'square', 0.05); }
  function sfxFall() {
    blip(190, 0.28, 'sawtooth', 0.5, 60);
    blip(90, 0.4, 'square', 0.4, 40, 0.05);
  }

  /* ---------------- 布局 ---------------- */
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    if (h >= w) {
      VW = 180;
      VH = Math.max(240, Math.min(430, Math.round(VW * h / w)));
    } else {
      VH = 180;
      VW = Math.max(260, Math.min(430, Math.round(VH * w / h)));
    }
    canvas.width = VW;
    canvas.height = VH;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.imageSmoothingEnabled = false;

    horizon = Math.round(VH * 0.46);
    FOCAL = VH * 0.5;
    S_HIT = FOCAL / HIT_Z;
    LANE = (0.24 * VW) / S_HIT;
    ROAD_HALF = (0.92 * VW) / S_HIT;
    CAM_H = (VH * 0.92 - horizon) / S_HIT;

    skateL = Math.round(VW * 0.26);
    skateR = Math.round(VW * 0.74);
    skateY = Math.round(horizon + CAM_H * S_HIT) - 2;
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  /* ---------------- 投影 ---------------- */
  function project(xw, z) {
    const s = FOCAL / Math.max(1, z);
    const sway = Math.sin((dist + z) * 0.02) * (z / Z_FAR) * 3.2;
    const dir = curve ? (curve.side === 0 ? -1 : 1) : 0;
    const bend = curveAmt * dir * (z / Z_FAR) * (z / Z_FAR) * VW * 0.13;
    return {
      x: VW / 2 + (xw + sway) * s + bend,
      y: horizon + CAM_H * s + bobY,
      s: s
    };
  }

  /* ---------------- 分数 / 连击 ---------------- */
  function mult() { return Math.min(4, 1 + Math.floor(combo / 10)); }
  function setScore(n) {
    score = n;
    hud.textContent = String(score);
  }

  /* ---------------- 游戏流程 ---------------- */
  function resetProps() {
    props = [];
    for (let i = 0; i < 12; i++) props.push(newProp(Z_NEAR + (i + 0.5) * (Z_FAR / 12)));
  }

  function newProp(z) {
    return {
      z: z,
      x: (Math.random() < 0.5 ? -1 : 1) * (ROAD_HALF + 2.5 + Math.random() * 7),
      h: 7 + Math.random() * 15
    };
  }

  function reset() {
    dist = 0;
    speed = 0;
    bothUpT = -1;
    obstacles = [];
    particles = [];
    fallCause = '';
    balance = 0;
    prevBoth = false;
    playTime = 0;
    charge = 0;
    chargeReady = false;
    dashT = 0;
    combo = 0;
    curve = null;
    curveAmt = 0;
    nextCurveAt = 170;
    beatAcc = 0;
    beatPulse = 0;
    beatCountdown = 2.5;
    fallT = 0;
    bobPhase = 0;
    bobY = 0;
    feet.forEach((f) => { f.sources.clear(); f.bob = 0; f.down = false; });
    resetProps();
    scoreAcc = 0;
    setScore(0);
    // 开局给一组目标，避免前几秒空跑
    addObstacle(randLane(), 95);
  }

  function toPlaying() {
    reset();
    state = 'playing';
    overlay.classList.add('hide');
  }

  function start() {
    audio();
    toPlaying();
  }

  function showReady() {
    state = 'ready';
    overlay.classList.remove('hide');
    overlay.innerHTML =
      '<div class="big">一步</div>' +
      '<div class="sub">按住向前滑 · 抬脚越过障碍</div>' +
      (best > 0 ? '<div class="sub">最佳 ' + best + '</div>' : '') +
      '<div class="hint">按住开始</div>';
  }

  // 摔倒：所有失败共用这一段动画
  function fall(cause) {
    if (state !== 'playing') return;
    state = 'falling';
    fallCause = cause || '';
    fallT = 0;
    bothUpT = 0;
    sfxFall();
    for (let i = 0; i < 14; i++) {
      particles.push({
        x: VW / 2 + (Math.random() - 0.5) * 40,
        y: VH - 8,
        vx: (Math.random() - 0.5) * 120,
        vy: -30 - Math.random() * 90,
        life: 0.5 + Math.random() * 0.35,
        t: 0
      });
    }
  }

  function finishOver() {
    state = 'over';
    overAt = performance.now();
    const isNewBest = score > best;
    if (isNewBest) {
      best = score;
      try { localStorage.setItem('yibu.best.score', String(best)); } catch (e) {}
    }
    overlay.classList.remove('hide');
    overlay.innerHTML =
      '<div class="big">' + score + '</div>' +
      '<div class="sub">' + (isNewBest ? '新纪录' : '最佳 ' + best) + '</div>' +
      '<div class="hint">按住重来</div>';
  }

  function doStep(side) {
    if (state !== 'playing') return;
    feet[side].bob = 1;
    sfxStep(side);
  }

  /* ---------------- 生成 ---------------- */
  const OBS_TYPES = [
    { type: 'rock', wf: 1.25, hf: 0.9 },
    { type: 'cone', wf: 0.7, hf: 1.3 },
    { type: 'barrier', wf: 1.8, hf: 0.55 }
  ];

  function randLane() { return Math.random() < 0.5 ? 0 : 1; }

  function addObstacle(lane, z) {
    const t = OBS_TYPES[Math.floor(Math.random() * OBS_TYPES.length)];
    obstacles.push({ lane: lane, z: z, type: t.type, wf: t.wf, hf: t.hf });
  }

  // 弯道内侧路缘：必须抬脚
  function addCurb(lane, z) {
    obstacles.push({ lane: lane, z: z, type: 'curb', wf: 1.9, hf: 0.46 });
  }

  function startCurve() {
    curve = { side: randLane(), t: 0, dur: 6 };
    const l = curve.side;
    // 间隔拉开，保证两次抬脚之间有足够时间双脚回落失衡
    addCurb(l, Z_FAR);
    addCurb(l, Z_FAR + 65);
    addCurb(l, Z_FAR + 130);
  }

  function spawnBeat() {
    const z = Z_FAR;
    const gap = Math.max(20, speed * BEAT * 1.1);
    const r = Math.random();

    if (dist < 60) {
      addObstacle(randLane(), z);
      return;
    }

    if (r < 0.46) {
      addObstacle(randLane(), z);
    } else if (r < 0.72) {
      const a = randLane();
      addObstacle(a, z);
      addObstacle(1 - a, z + gap * 0.85);
    } else if (r < 0.88) {
      const a = randLane();
      addObstacle(a, z);
      addObstacle(a, z + gap * 0.5);
    } else {
      addObstacle(randLane(), z + gap * 0.35);
    }
  }

  /* ---------------- 输入 ---------------- */
  const pointerSide = new Map();

  function press(side, id) {
    const f = feet[side];
    const wasDown = f.sources.size > 0;
    f.sources.add(id);
    if (!wasDown) doStep(side);
  }

  function release(side, id) {
    feet[side].sources.delete(id);
  }

  function sideAt(x) {
    return x < window.innerWidth / 2 ? 0 : 1;
  }

  function onDown(e) {
    e.preventDefault();
    audio();

    if (state === 'ready') {
      start();
    } else if (state === 'over') {
      if (performance.now() - overAt > 420) toPlaying();
      else return;
    } else if (state === 'falling') {
      return;
    }
    if (state !== 'playing') return;

    const side = sideAt(e.clientX);
    pointerSide.set(e.pointerId, side);
    press(side, 'p' + e.pointerId);
  }

  function onUp(e) {
    const side = pointerSide.get(e.pointerId);
    if (side === undefined) return;
    pointerSide.delete(e.pointerId);
    release(side, 'p' + e.pointerId);
  }

  canvas.addEventListener('pointerdown', onDown, { passive: false });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  window.addEventListener('blur', () => {
    pointerSide.forEach((side, id) => release(side, 'p' + id));
    pointerSide.clear();
  });

  const KEY_SIDE = { KeyA: 0, ArrowLeft: 0, KeyL: 1, ArrowRight: 1 };
  const keysDown = new Set();

  window.addEventListener('keydown', (e) => {
    const side = KEY_SIDE[e.code];
    if (side === undefined || e.repeat) return;
    e.preventDefault();
    audio();

    if (state === 'ready') {
      start();
    } else if (state === 'over') {
      if (performance.now() - overAt > 420) toPlaying();
      else return;
    } else if (state === 'falling') {
      return;
    }
    if (state !== 'playing') return;

    const id = 'k' + e.code;
    if (!keysDown.has(id)) {
      keysDown.add(id);
      press(side, id);
    }
  });

  window.addEventListener('keyup', (e) => {
    const side = KEY_SIDE[e.code];
    if (side === undefined) return;
    const id = 'k' + e.code;
    if (keysDown.has(id)) {
      keysDown.delete(id);
      release(side, id);
    }
  });

  window.addEventListener('contextmenu', (e) => e.preventDefault());

  /* ---------------- 环境 ---------------- */
  function isTunnel() {
    const seg = Math.floor(dist / 100);
    return seg > 0 && seg % 7 === 5;
  }

  // 隧道进出的柔和过渡
  function tunnelMix() {
    const seg = Math.floor(dist / 100);
    if (seg <= 0 || seg % 7 !== 5) return 0;
    const local = dist - seg * 100;
    return clamp(Math.min(local, 100 - local) / 8, 0, 1);
  }

  function updatePalette() {
    const phase = dist / 100;
    const idx = ((Math.floor(phase) % 4) + 4) % 4;
    const frac = phase - Math.floor(phase);
    let base = PALETTES[idx];
    if (frac > 0.86) {
      base = mixPal(PALETTES[idx], PALETTES[(idx + 1) % 4], (frac - 0.86) / 0.14);
    }
    const tm = tunnelMix();
    if (tm > 0) base = mixPal(base, TUNNEL_PAL, 0.88 * tm);
    pal = base;
  }

  /* ---------------- 世界更新 ---------------- */
  function updateWorld(dt) {
    // 障碍
    for (const o of obstacles) {
      o.z -= speed * dt;
      if (!o.done && o.z <= HIT_Z) {
        o.done = true;
        if (feet[o.lane].down) {
          fall('hit');
          break;
        }
        combo++;
        sfxPass();
      }
    }
    obstacles = obstacles.filter((o) => o.z > Z_NEAR - 3);
    if (state !== 'playing') return;

    // 弯道
    if (!curve && dist >= nextCurveAt) startCurve();
    if (curve) {
      if (!curve.done) {
        curve.t += dt;
        if (curve.t >= curve.dur) curve.done = true;
      }
      curveAmt = approach(curveAmt, curve.done ? 0 : 1, dt * 2.4);
      if (curve.done && curveAmt < 0.02) {
        curve = null;
        curveAmt = 0;
        nextCurveAt = dist + 180 + Math.random() * 80;
      }
    }

    // 节拍：地鼓脉冲 + 量化生成
    beatAcc += dt;
    while (beatAcc >= BEAT) {
      beatAcc -= BEAT;
      beatPulse = 1;
      sfxTick();
      beatCountdown -= 1;
      if (beatCountdown <= 0) {
        if (!curve && state === 'playing') spawnBeat();
        beatCountdown += Math.max(1.5, 3 - dist * 0.002);
      }
    }
    beatPulse = Math.max(0, beatPulse - dt * 3.4);
  }

  /* ---------------- 更新 ---------------- */
  function update(dt) {
    for (const f of feet) f.down = f.sources.size > 0;
    updatePalette();

    if (state === 'playing') {
      const anyDown = feet[0].down || feet[1].down;
      dashT = Math.max(0, dashT - dt);
      const envMul = (isTunnel() ? 1.12 : 1) * (dashT > 0 ? 1.6 : 1);
      const target = anyDown ? (26 + Math.min(24, dist * 0.02)) * envMul : 0;
      speed += (target - speed) * Math.min(1, dt * 8);
      if (!anyDown && speed < 4) speed = 0;
      dist += speed * dt;
      scoreAcc += (speed * dt) / 10 * mult();
      if (Math.floor(scoreAcc) !== score) setScore(Math.floor(scoreAcc));
      bobPhase += speed * dt * 0.22;
      bobY = Math.sin(bobPhase) * 0.9;

      // 失衡：单脚支撑累积，双脚支撑回落（开局 1.4s 内不计）
      playTime += dt;
      const one = feet[0].down !== feet[1].down;
      if (one && playTime > 1.4) {
        balance += (0.45 + speed * 0.004) * dt;
        if (balance >= 1) {
          balance = 1;
          fall('balance');
        }
      } else if (!one) {
        balance = Math.max(0, balance - 1.2 * dt);
      }

      // 双脚离地
      const bothUp = !feet[0].down && !feet[1].down;
      if (bothUp) {
        bothUpT += dt;
        if (bothUpT > BOTH_UP_GRACE) fall('bothup');
      } else {
        bothUpT = 0;
      }

      // 双踩蓄力 → 单脚抬起触发冲刺
      const nowBoth = feet[0].down && feet[1].down;
      if (nowBoth) {
        charge = Math.min(1, charge + dt / 1.2);
        if (charge >= 1) chargeReady = true;
      } else if (prevBoth && chargeReady && !bothUp && state === 'playing') {
        chargeReady = false;
        charge = 0;
        dashT = 0.9;
        sfxDash();
      } else if (!chargeReady) {
        charge = Math.max(0, charge - dt * 0.9);
      }
      prevBoth = nowBoth;

      if (state === 'playing') updateWorld(dt);
    } else if (state === 'falling') {
      fallT += dt;
      speed *= Math.max(0, 1 - dt * 5);
      dist += speed * dt;
      if (fallT >= FALL_TIME) finishOver();
    }

    // 路边景物
    for (const p of props) {
      p.z -= speed * dt;
      if (p.z < Z_NEAR) {
        const np = newProp(Z_FAR + Math.random() * 12);
        p.z = np.z; p.x = np.x; p.h = np.h;
      }
    }

    for (const f of feet) f.bob = Math.max(0, f.bob - dt * 2.6);
    for (const p of particles) {
      p.t += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 180 * dt;
    }
    particles = particles.filter((p) => p.t < p.life);
  }

  /* ---------------- 绘制：像素元素 ---------------- */
  function drawSkyline() {
    ctx.fillStyle = pal.buildA;
    const n = Math.ceil(VW / 16) + 3;
    const scroll = (dist * 1.1) % 16;
    for (let i = 0; i < n; i++) {
      const bx = Math.round(i * 16 - scroll - 8);
      const bh = 5 + ((i * 13) % 15);
      ctx.fillRect(bx, horizon - bh, 11, bh);
    }
    ctx.fillStyle = pal.buildB;
    for (let i = 0; i < n; i++) {
      const bx = Math.round(i * 16 - scroll - 8);
      const bh = 5 + ((i * 7) % 9);
      ctx.fillRect(bx + 2, horizon - bh, 7, bh);
    }
  }

  function drawRoad() {
    // 路面
    for (let z = Z_NEAR; z < Z_FAR; z += 6) {
      const a = project(-ROAD_HALF, z);
      const b = project(ROAD_HALF, z);
      const c = project(ROAD_HALF, z + 6.4);
      const d = project(-ROAD_HALF, z + 6.4);
      ctx.fillStyle = pal.road;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.lineTo(c.x, c.y);
      ctx.lineTo(d.x, d.y);
      ctx.closePath();
      ctx.fill();
    }

    // 地面接缝：传达速度
    for (let z = Z_NEAR; z < Z_FAR; z += 2) {
      if (((z + dist) % 12) >= 2) continue;
      const a = project(-ROAD_HALF, z);
      const b = project(ROAD_HALF, z);
      const c = project(ROAD_HALF, z + 2);
      const d = project(-ROAD_HALF, z + 2);
      ctx.fillStyle = pal.seam;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.lineTo(c.x, c.y);
      ctx.lineTo(d.x, d.y);
      ctx.closePath();
      ctx.fill();
    }

    // 节拍地鼓：一道扫过的亮带
    if (beatPulse > 0.02) {
      const z0 = 18 + (1 - beatPulse) * 26;
      const a = project(-ROAD_HALF, z0);
      const b = project(ROAD_HALF, z0);
      const c = project(ROAD_HALF, z0 + 7);
      const d = project(-ROAD_HALF, z0 + 7);
      ctx.globalAlpha = beatPulse * 0.42;
      ctx.fillStyle = pal.line;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.lineTo(c.x, c.y);
      ctx.lineTo(d.x, d.y);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // 边线（连续）
    for (const side of [-1, 1]) {
      ctx.beginPath();
      for (let z = Z_NEAR; z <= Z_FAR; z += 6) {
        const p = project(side * ROAD_HALF, z);
        if (z === Z_NEAR) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.strokeStyle = pal.ink;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // 中线虚线
    for (let z = Z_NEAR; z < Z_FAR; z += 4) {
      if (((z + dist) % 16) < 8) {
        const a = project(0, z);
        const b = project(0, z + 3.6);
        const w = Math.max(1, Math.round(0.22 * a.s));
        ctx.fillStyle = pal.line;
        ctx.fillRect(Math.round(a.x - w / 2), Math.round(a.y), w, Math.max(1, Math.round(b.y - a.y)));
      }
    }
  }

  function drawProps() {
    const list = props.slice().sort((p, q) => q.z - p.z);
    for (const p of list) {
      if (p.z <= Z_NEAR) continue;
      const a = project(p.x, p.z);
      if (a.x < -20 || a.x > VW + 20) continue;
      const w = Math.max(1, Math.round(0.55 * a.s));
      const h = Math.round(p.h * a.s);
      ctx.fillStyle = pal.prop;
      ctx.fillRect(Math.round(a.x - w / 2), Math.round(a.y - h), w, h);
      ctx.fillStyle = pal.propTop;
      ctx.fillRect(Math.round(a.x - w / 2), Math.round(a.y - h), w, Math.max(1, Math.round(w * 0.6)));
    }
  }

  function drawRock(x, y, w, h) {
    const w1 = Math.max(2, Math.round(w));
    const h1 = Math.max(2, Math.round(h));
    const left = Math.round(x - w1 / 2);
    const top = Math.round(y - h1);
    ctx.fillStyle = pal.propTop;
    ctx.fillRect(left, top + Math.round(h1 * 0.3), w1, h1 - Math.round(h1 * 0.3));
    ctx.fillRect(left + Math.round(w1 * 0.16), top, Math.round(w1 * 0.68), Math.round(h1 * 0.45));
    ctx.fillStyle = pal.line;
    ctx.fillRect(left + Math.round(w1 * 0.24), top + Math.round(h1 * 0.12), Math.max(1, Math.round(w1 * 0.26)), Math.max(1, Math.round(h1 * 0.3)));
  }

  function drawCone(x, y, w, h) {
    const w1 = Math.max(2, Math.round(w));
    const h1 = Math.max(2, Math.round(h));
    const left = Math.round(x - w1 / 2);
    const top = Math.round(y - h1);
    for (let i = 0; i < 4; i++) {
      const t = i / 4;
      const ww = Math.max(1, Math.round(w1 * (1 - t * 0.62)));
      ctx.fillStyle = (i === 1) ? PAPER : DANGER;
      ctx.fillRect(Math.round(x - ww / 2), Math.round(top + h1 * t), ww, Math.max(1, Math.round(h1 / 4)));
    }
    ctx.fillStyle = pal.ink;
    ctx.fillRect(left - Math.round(w1 * 0.18), y - Math.max(1, Math.round(h1 * 0.08)), Math.round(w1 * 1.36), Math.max(1, Math.round(h1 * 0.08)));
  }

  function drawBarrier(x, y, w, h) {
    const w1 = Math.max(3, Math.round(w));
    const h1 = Math.max(2, Math.round(h));
    const left = Math.round(x - w1 / 2);
    const top = Math.round(y - h1);
    ctx.fillStyle = DANGER;
    ctx.fillRect(left, top, w1, h1);
    ctx.fillStyle = pal.ink;
    const step = Math.max(3, Math.round(w1 / 4));
    for (let sx = left; sx < left + w1; sx += step * 2) {
      ctx.fillRect(sx, top, Math.max(1, Math.round(step * 0.6)), h1);
    }
    ctx.fillRect(left, y - 1, 1, Math.round(h1 * 0.6));
    ctx.fillRect(left + w1 - 1, y - 1, 1, Math.round(h1 * 0.6));
  }

  // 弯道路缘：贴地的低矮条纹块
  function drawCurb(x, y, w, h) {
    const w1 = Math.max(4, Math.round(w));
    const h1 = Math.max(2, Math.round(h));
    const left = Math.round(x - w1 / 2);
    const top = Math.round(y - h1);
    ctx.fillStyle = pal.ink;
    ctx.fillRect(left, top, w1, h1);
    ctx.fillStyle = DANGER;
    const step = Math.max(3, Math.round(w1 / 6));
    for (let sx = left; sx < left + w1; sx += step * 2) {
      ctx.fillRect(sx, top, Math.min(step, left + w1 - sx), h1);
    }
    ctx.fillStyle = pal.line;
    ctx.fillRect(left, top + h1, w1, 1);
  }

  function drawObjects() {
    const list = obstacles.slice().sort((a, b) => b.z - a.z);
    for (const it of list) {
      if (it.z < HIT_Z + 0.5) continue;
      const xw = it.lane === 0 ? -LANE : LANE;
      const p = project(xw, it.z);
      if (p.x < -40 || p.x > VW + 40) continue;

      if (it.z < 60) {
        ctx.globalAlpha = Math.max(0, 0.16 * (1 - it.z / 60));
        ctx.fillStyle = pal.ink;
        ctx.fillRect(Math.round(p.x - 4 * p.s * 0.4), Math.round(p.y - 1), Math.max(1, Math.round(8 * p.s * 0.4)), 1);
        ctx.globalAlpha = 1;
      }

      const w = it.wf * LANE * p.s;
      const h = it.hf * LANE * p.s;
      if (it.type === 'rock') drawRock(p.x, p.y, w, h);
      else if (it.type === 'cone') drawCone(p.x, p.y, w, h);
      else if (it.type === 'curb') drawCurb(p.x, p.y, w, h);
      else drawBarrier(p.x, p.y, w, h);
    }
  }

  function drawSkate(x, y, side, down, flung) {
    const dir = side === 0 ? -1 : 1;
    const lift = down ? 0 : 11;
    const bob = down ? Math.round(feet[side].bob * 2) : 0;
    const px = Math.round(x + (down ? 0 : -dir * 2));
    const py = Math.round(y - lift - bob);

    if (down) {
      ctx.globalAlpha = 0.16;
      ctx.fillStyle = pal.ink;
      ctx.fillRect(px - 8, Math.round(y + 1), 16, 2);
      ctx.globalAlpha = 1;
    }

    // 冲刺尾迹
    if (dashT > 0 && down) {
      ctx.globalAlpha = Math.min(0.4, dashT / 0.9 * 0.4);
      ctx.fillStyle = DANGER;
      ctx.fillRect(px - 14, py - 7, 5, 1);
      ctx.fillRect(px - 18, py - 4, 7, 1);
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = pal.ink;
    // 轮子
    for (let i = 0; i < 5; i++) ctx.fillRect(px - 7 + i * 3, py - 2, 2, 2);
    // 鞋身
    ctx.fillRect(px - 7, py - 10, 14, 7);
    // 鞋帮
    ctx.fillRect(px - 5, py - 13, 10, 4);
    // 鞋头
    ctx.fillRect(px + dir * 7 - (dir < 0 ? 2 : 0), py - 8, 2, 4);
    // 鞋带
    ctx.fillStyle = pal.road;
    ctx.fillRect(px - 3, py - 9, 6, 1);
    // 轮子高光
    if (!flung) {
      ctx.fillStyle = pal.road;
      ctx.fillRect(px - 7 + (Math.floor(dist * 0.7 + side * 2) % 5) * 3, py - 2, 1, 1);
    }
  }

  function supportSide() {
    if (feet[0].down && !feet[1].down) return 0;
    if (feet[1].down && !feet[0].down) return 1;
    return -1;
  }

  function drawBalanceRing(x, y) {
    const cx = Math.round(x);
    const cy = Math.round(y - 2);
    const r = Math.round(10 + balance * 6);
    ctx.lineWidth = 2;

    // 底环
    ctx.globalAlpha = 0.2;
    ctx.strokeStyle = pal.ink;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();

    // 进度弧：从左下扫到右下
    const start = Math.PI * 0.72;
    ctx.globalAlpha = 0.55 + balance * 0.45;
    ctx.strokeStyle = DANGER;
    ctx.beginPath();
    ctx.arc(cx, cy, r, start, start + Math.PI * 1.56 * Math.min(1, balance), false);
    ctx.stroke();

    // 临界时整圈闪烁
    if (balance > 0.78) {
      ctx.globalAlpha = 0.5 * (0.5 + 0.5 * Math.sin(performance.now() * 0.022));
      ctx.beginPath();
      ctx.arc(cx, cy, r + 3, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawSkates(tilt) {
    if (state === 'falling' || state === 'over') {
      const t = state === 'over' ? 1 : Math.min(1, fallT / FALL_TIME);
      const e = t * t * (3 - 2 * t);
      drawSkate(skateL - e * 26, skateY - e * 30, 0, false, true);
      drawSkate(skateR + e * 30, skateY - e * 34, 1, false, true);
      return;
    }
    const ready = state === 'ready';

    ctx.save();
    ctx.translate(VW / 2, skateY);
    ctx.rotate(tilt);
    ctx.translate(-VW / 2, -skateY);

    // 失衡时支撑脚轻微发抖
    const ss = state === 'playing' ? supportSide() : -1;
    const wob = (ss >= 0 && balance > 0.45)
      ? Math.round(Math.sin(performance.now() * 0.05) * (balance - 0.45) * 6)
      : 0;

    drawSkate(skateL + (ss === 0 ? wob : 0), skateY, 0, ready || feet[0].down, false);
    drawSkate(skateR + (ss === 1 ? wob : 0), skateY, 1, ready || feet[1].down, false);

    // 失衡环：支撑脚下方
    if (ss >= 0 && balance > 0.03) {
      drawBalanceRing(ss === 0 ? skateL : skateR, skateY);
    }
    ctx.restore();
  }

  function drawTunnel() {
    const tm = tunnelMix();
    if (tm < 0.02) return;
    ctx.globalAlpha = tm;
    ctx.fillStyle = '#0b0c10';
    ctx.fillRect(0, 0, VW, Math.round(horizon * 0.94));
    // 左右洞壁
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s < 0 ? 0 : VW, 0);
      ctx.lineTo(VW / 2, horizon * 0.94);
      ctx.lineTo(s < 0 ? 0 : VW, VH);
      ctx.closePath();
      ctx.fill();
    }
    // 灯带
    ctx.fillStyle = '#ffd27a';
    ctx.globalAlpha = tm * (0.45 + beatPulse * 0.55);
    for (let i = 0; i < 5; i++) {
      const t = (i + 1) / 6;
      const lx = Math.round(t * VW * 0.42);
      const ly = Math.round(horizon * 0.94 - t * horizon * 0.5);
      ctx.fillRect(lx, ly, 2, 1);
      ctx.fillRect(VW - lx - 2, ly, 2, 1);
    }
    ctx.globalAlpha = 1;
  }

  function drawEffects() {
    const now = performance.now() / 1000;

    // 速度线
    if (speed > 34) {
      const a = Math.min(0.16, (speed - 34) / 90);
      ctx.globalAlpha = a;
      ctx.fillStyle = pal.ink;
      for (let i = 0; i < 6; i++) {
        const yy = horizon + 14 + ((i * 37 + Math.floor(dist * 3)) % (VH - horizon - 20));
        const xx = (i % 2 === 0) ? 4 : VW - 26;
        ctx.fillRect(xx, yy, 10 + (i % 3) * 4, 1);
      }
      ctx.globalAlpha = 1;
    }

    // 雨
    if (!isTunnel() && (((Math.floor(dist / 100) % 4) + 4) % 4) === 3) {
      ctx.globalAlpha = 0.16;
      ctx.strokeStyle = pal.ink;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i < 14; i++) {
        const seed = i * 97.3;
        const x = ((seed * 7 + now * 70) % (VW + 20)) - 10;
        const y = ((seed * 13 + now * 300) % (VH + 20)) - 10;
        ctx.moveTo(x, y);
        ctx.lineTo(x - 2, y + 5);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // 失衡警示：越接近摔倒，两侧橙光越强并随心跳闪动
    if (state === 'playing' && balance > 0.42) {
      const k = Math.min(1, (balance - 0.42) / 0.58);
      const pulse = 0.6 + 0.4 * Math.sin(performance.now() * 0.014);
      const wpx = 2 + Math.round(k * 4);
      ctx.globalAlpha = 0.12 + 0.45 * k * pulse;
      ctx.fillStyle = DANGER;
      ctx.fillRect(0, 0, wpx, VH);
      ctx.fillRect(VW - wpx, 0, wpx, VH);
      ctx.fillRect(0, 0, VW, Math.max(1, Math.round(k * 2)));
      ctx.globalAlpha = 0.08 * k;
      ctx.fillRect(0, VH - 2, VW, 2);
      ctx.globalAlpha = 1;
    }

    // 冲刺边缘光
    if (dashT > 0) {
      ctx.globalAlpha = Math.min(0.5, dashT / 0.9 * 0.5);
      ctx.fillStyle = DANGER;
      ctx.fillRect(0, 0, 2, VH);
      ctx.fillRect(VW - 2, 0, 2, VH);
      ctx.globalAlpha = 1;
    }

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
      ctx.fillStyle = pal.ink;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2);
    }
    ctx.globalAlpha = 1;

    if (state === 'falling') {
      const t = Math.min(1, fallT / FALL_TIME);
      if (t < 0.22) {
        ctx.globalAlpha = (0.22 - t) / 0.22 * 0.5;
        ctx.fillStyle = DANGER;
        ctx.fillRect(0, 0, VW, VH);
        ctx.globalAlpha = 1;
      }
      ctx.globalAlpha = t * 0.35;
      ctx.fillStyle = pal.ink;
      ctx.fillRect(0, 0, VW, Math.round(2 + t * 6));
      ctx.fillRect(0, VH - Math.round(2 + t * 6), VW, Math.round(2 + t * 6));
      ctx.globalAlpha = 1;
    }
  }

  function drawHUDText() {
    if (state !== 'playing') return;
    const now = performance.now();

    if (mult() > 1) {
      ctx.textAlign = 'right';
      ctx.textBaseline = 'top';
      ctx.font = '7px ui-monospace, monospace';
      ctx.fillStyle = DANGER;
      ctx.fillText('×' + mult(), VW - 6, 6);
    }

    if (charge > 0.02 || chargeReady) {
      const bw = 32;
      const bx = Math.round(VW / 2 - bw / 2);
      const by = VH - 10;
      ctx.globalAlpha = 0.16;
      ctx.fillStyle = pal.ink;
      ctx.fillRect(bx, by, bw, 2);
      const blink = chargeReady ? (0.55 + 0.45 * Math.sin(now * 0.012)) : 1;
      ctx.globalAlpha = 0.9 * blink;
      ctx.fillStyle = chargeReady ? DANGER : pal.ink;
      ctx.fillRect(bx, by, Math.round(bw * (chargeReady ? 1 : charge)), 2);
      ctx.globalAlpha = 1;
    }

    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  /* ---------------- 渲染 ---------------- */
  let lastHudColor = '';

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, VW, VH);
    ctx.fillStyle = pal.sky;
    ctx.fillRect(0, 0, VW, VH);

    drawSkyline();

    const t = Math.min(1, state === 'over' ? 1 : (state === 'falling' ? fallT / FALL_TIME : 0));
    const fe = t * t * (3 - 2 * t);

    // 失衡：镜头向支撑脚方向倾斜，重心越偏越明显
    const bs = state === 'playing' ? supportSide() : -1;
    let leanX = 0, tilt = 0, shakeX = 0;
    if (bs >= 0 && balance > 0.02) {
      const dir = bs === 0 ? -1 : 1;
      leanX = dir * balance * 9;
      tilt = dir * balance * 0.035;
      if (balance > 0.68) {
        shakeX = Math.sin(performance.now() * 0.05) * (balance - 0.68) * 8;
      }
    }

    ctx.save();
    ctx.translate(leanX + shakeX, 0);
    if (tilt !== 0) {
      ctx.translate(VW / 2, VH);
      ctx.rotate(tilt * 0.5);
      ctx.translate(-VW / 2, -VH);
    }
    if (curveAmt > 0.001 && curve) {
      const roll = curveAmt * (curve.side === 0 ? -0.08 : 0.08);
      ctx.translate(VW / 2, horizon * 1.3);
      ctx.rotate(roll);
      ctx.translate(-VW / 2, -horizon * 1.3);
    }
    if (fe > 0) {
      ctx.translate(VW / 2, VH * 0.72);
      ctx.rotate(fe * 0.13);
      ctx.translate(-VW / 2, -VH * 0.72);
      ctx.translate(0, fe * 12);
    }
    drawRoad();
    drawProps();
    drawObjects();
    drawTunnel();
    ctx.restore();

    drawSkates(tilt);
    drawEffects();
    drawHUDText();

    if (pal.ink !== lastHudColor) {
      hud.style.color = pal.ink;
      lastHudColor = pal.ink;
    }
  }

  /* ---------------- 主循环 ---------------- */
  let lastTime = 0;

  function frame(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000 || 0);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  resize();
  reset();
  showReady();
  requestAnimationFrame((t) => {
    lastTime = t;
    frame(t);
  });
})();
</script>
</body>
</html>
